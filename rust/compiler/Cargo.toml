[package]
name = "hara-compiler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
description = "Full source, HALC, bytecode and optional WASM compiler for Hara"
repository = "https://github.com/hara-lang/hara"
homepage = "https://www.hara-lang.org"
documentation = "https://docs.rs/hara-compiler"
keywords = ["hara", "compiler", "bytecode", "wasm"]
categories = ["compilers", "wasm"]

[features]
default = []
full-wasm = ["hara-wasm/whole-wasm"]

[dependencies]
hara-vm = { version = "0.1.0", path = "../vm-runtime" }
hara-wasm = { version = "0.1.3", path = "..", default-features = false, features = ["bytecode-vm", "halc-encoder"] }
