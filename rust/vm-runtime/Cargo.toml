[package]
name = "hara-vm"
version = "0.1.0"
edition = "2021"
license = "EPL-2.0"
rust-version = "1.78"
description = "VM-only execution surface for verified Hara bytecode"
repository = "https://github.com/hara-lang/hara"
homepage = "https://www.hara-lang.org"
documentation = "https://docs.rs/hara-vm"
keywords = ["hara", "virtual-machine", "bytecode", "runtime"]
categories = ["compilers", "virtualization"]

[dependencies]
hara-wasm = { version = "0.1.1", path = "..", default-features = false, features = ["bytecode-vm"] }
