[package]
name = "hara-wasm-raw"
version = "0.1.0"
edition = "2021"
license = "EPL-2.0"
rust-version = "1.78"

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[features]
evaluation-journal = []
dev-trace = ["evaluation-journal"]
halc-encoder = []
hir-encoder = ["halc-encoder"]

[dependencies]
sha2 = "0.10"
