[package]
name = "hara-wasm"
version = "0.1.0"
edition = "2021"
description = "Portable browser runtime slice for Hara"
license = "EPL-2.0"
rust-version = "1.78"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "18.0.0", default-features = false, features = ["cranelift", "runtime"] }
rustyline = "14.0.0"
home = "=0.5.9"

[dev-dependencies]

