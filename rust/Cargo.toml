[package]
name = "hara-wasm"
version = "0.1.0"
edition = "2021"
description = "Portable browser runtime slice for Hara"
license = "EPL-2.0"
rust-version = "1.78"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Development-only structured evaluator tracing.  Keep this opt-in so
# embedded and production builds do not carry collectors or trace storage.
dev-trace = []
# Existing optional encoder gate (declared here so Cargo can validate it).
hir-encoder = []
# Experimental staged bytecode VM (notes/rust-bytecode-vm.md). Non-default:
# all VM entry points are gated behind this feature.
bytecode-vm = []

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "18.0.0", default-features = false, features = ["cranelift", "runtime"] }
rustyline = "14.0.0"
home = "=0.5.9"
semver = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }

[dev-dependencies]
