[package]
name = "hara-wasm"
version = "0.1.4"
edition = "2021"
description = "Portable browser runtime slice for Hara"
license = "Apache-2.0"
rust-version = "1.78"
repository = "https://github.com/hara-lang/hara"
homepage = "https://www.hara-lang.org"
documentation = "https://docs.rs/hara-wasm"

[workspace]
members = [".", "abi", "compiler", "raw", "vm-runtime"]
default-members = ["."]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Structured Evaluation Journal. Keep this opt-in so embedded and production
# builds do not carry collectors or journal storage.
evaluation-journal = []
dev-trace = ["evaluation-journal"]
# Existing optional encoder gate (declared here so Cargo can validate it).
halc-encoder = []
hir-encoder = ["halc-encoder"]
# Experimental staged bytecode VM (notes/rust-bytecode-vm.md). Non-default:
# all VM entry points are gated behind this feature.
bytecode-vm = []
tracing-jit = ["bytecode-vm"]
native-jit = ["tracing-jit"]
whole-wasm = ["bytecode-vm", "dep:wasm-encoder"]

[profile.browser-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
hara-abi = { version = "0.1.0", path = "abi" }
wasm-encoder = { version = "0.41.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "18.0.0", default-features = false, features = ["cranelift", "runtime"] }
rustyline = "14.0.0"
home = "=0.5.9"
semver = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }

# Experimental bytecode VM benchmark driver (issue #195); requires the
# non-default bytecode-vm feature so default builds are unaffected.
[[bin]]
name = "hara-bytecode-benchmark"
path = "src/bin/hara-bytecode-benchmark.rs"
required-features = ["bytecode-vm"]

[[bin]]
name = "hara-foundation-artifact"
path = "src/bin/hara-foundation-artifact.rs"
required-features = ["bytecode-vm"]

[[bin]]
name = "hara-bytecode-conformance-artifact"
path = "src/bin/hara-bytecode-conformance-artifact.rs"
required-features = ["bytecode-vm"]

[[bin]]
name = "hara-bytecode-artifact"
path = "src/bin/hara-bytecode-artifact.rs"
required-features = ["bytecode-vm"]

[[bin]]
name = "hara-code-analyzer"
path = "src/bin/hara-code-analyzer.rs"
required-features = ["whole-wasm"]

[[bin]]
name = "hara-rust-full"
path = "src/bin/hara-rust-full.rs"
required-features = ["whole-wasm"]

[dev-dependencies]
