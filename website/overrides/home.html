{% extends "main.html" %}
{% block header %}{% endblock %}
{% block tabs %}{% endblock %}

{% block extrahead %}
  {{ super() }}
  <link rel="stylesheet" href="stylesheets/home.css">
{% endblock %}

{% block container %}
<div id="hara-home">
  <div id="hara-scene-mount"></div>

  <nav id="hara-scene-dots" aria-label="Scenes"></nav>

  <div id="hara-scene-controls">
    <span id="hara-wasm-led" title="WASM status"></span>
    <button id="hara-zoom-out" aria-label="Zoom out">−</button>
    <button id="hara-zoom-in" aria-label="Zoom in">+</button>
    <div class="hara-pan-pad">
      <button id="hara-pan-up" aria-label="Pan up">↑</button>
      <button id="hara-pan-left" aria-label="Pan left">←</button>
      <button id="hara-pan-right" aria-label="Pan right">→</button>
      <button id="hara-pan-down" aria-label="Pan down">↓</button>
    </div>
    <button id="hara-toggle-editor" aria-label="Editor">editor</button>
    <button id="hara-toggle-repl" aria-label="REPL">repl</button>
  </div>

  <aside id="hara-editor-panel">
    <button id="hara-editor-close" aria-label="Close editor">×</button>
    <div id="hara-editor-toolbar">
      <button id="hara-editor-run" type="button">Run</button>
      <button id="hara-editor-download" type="button">Download</button>
      <button id="hara-editor-fork" type="button">Fork</button>
    </div>
    <div id="hara-editor-mount"></div>
  </aside>

  <section id="hara-repl-panel">
    <button id="hara-repl-close" aria-label="Close REPL">×</button>
    <pre id="hara-repl-log"></pre>
    <input id="hara-repl-input" placeholder="(+ 19 23)">
  </section>
</div>

<script type="module" src="javascripts/scene-manager.js"></script>
<script type="module" src="javascripts/home-repl.js"></script>
<script type="module" src="javascripts/home-editor.js"></script>
<script type="module" src="javascripts/home.js"></script>
{% endblock %}
