{% extends "main.html" %}
{% block tabs %}{% endblock %}
{% block container %}
<!--
  Hara Studio — live teaching environment.

  The whole UI is built by the shared studio component
  (rust/web/studio/ui.js, deployed under /rust/studio/ by pages.yml) inside
  the mount point below; website/docs/javascripts/studio.js is the thin
  bootstrap that fetches the raw wasm module + studio hal resources, creates
  the kernel broker, and mounts the UI. Styling comes from
  rust/web/studio/studio.css (@imported by stylesheets/hara.css).
-->
<div id="hara-studio-mount" data-hara-studio="mount">
  <noscript>
    <div class="hara-studio">
      <div class="hara-studio-head">
        <span class="hara-kicker">HARA STUDIO</span>
        <span class="hara-index">JAVASCRIPT REQUIRED</span>
      </div>
    </div>
  </noscript>
</div>
<script type="module" src="{{ 'javascripts/studio.js' | url }}"></script>
{% endblock %}
