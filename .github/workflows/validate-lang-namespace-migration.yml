name: Validate lang namespace migration

on:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/scripts/migrate-tahto-to-lang'
      - 'plans/lang-namespace-migration.md'
      - '.github/workflows/bootstrap-lang-namespace-migration.yml'
      - '.github/workflows/validate-lang-namespace-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-lang-namespace-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration script syntax
        run: python3 -m py_compile packaging/scripts/migrate-tahto-to-lang
      - name: Execute generated migration and static guards
        run: python3 packaging/scripts/migrate-tahto-to-lang
      - name: Verify generated tree has no bootstrap drift
        run: |
          test -d core/lib/src/lang
          test -d core/lib/test/lang
          test ! -e core/lib/src/tahto
          test ! -e core/lib/test/tahto
          python3 packaging/scripts/check-language-source-layout
          python3 packaging/scripts/check-no-tahto-namespaces
          python3 packaging/scripts/sync-rust-hal-src --check
