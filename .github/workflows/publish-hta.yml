name: Publish @hara-lang/hta

on:
  push:
    tags:
      - "hta-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: rust/web/package-lock.json

      - name: Verify tag and package version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./rust/web/packages/hta/package.json').version")
          test "${GITHUB_REF_NAME}" = "hta-v${VERSION}"

      - name: Install workspace dependencies
        run: npm ci --prefix rust/web

      - name: Test package source and packed consumer
        run: |
          npm --prefix rust/web run test:hta
          npm --prefix rust/web run test:hta:pack

      - name: Publish or verify existing package
        working-directory: rust/web
        run: |
          VERSION=$(node -p "require('./packages/hta/package.json').version")
          LOCAL_INTEGRITY=$(npm pack --dry-run --json --workspace @hara-lang/hta | node -e "let source=''; process.stdin.on('data', chunk => source += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(source)[0].integrity))")
          REMOTE_INTEGRITY=$(npm view "@hara-lang/hta@${VERSION}" dist.integrity 2>/dev/null || true)
          if [ -n "${REMOTE_INTEGRITY}" ]; then
            test "${LOCAL_INTEGRITY}" = "${REMOTE_INTEGRITY}"
            echo "@hara-lang/hta@${VERSION} already exists with matching integrity"
          else
            npm publish --workspace @hara-lang/hta
          fi
