name: Temporary run language migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lang-layout-migration
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Execute the embedded migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/tmp-migrate-lang-layout.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          python3 packaging/scripts/sync-rust-hal-src"
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(dedent(body), 'tmp-migrate-lang-layout', 'exec'))
          PY

          python3 packaging/scripts/sync-rust-hal-src
          python3 packaging/scripts/check-lang-layout
          python3 packaging/scripts/sync-rust-hal-src --check
          git diff --check

      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Rename Tahto namespaces and split language sources"
          git push origin HEAD:agent/lang-layout-migration
