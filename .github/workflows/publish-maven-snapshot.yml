name: Publish Maven snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish org.hara-lang:hara.lang snapshot
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check out conformance specifications and documentation
      run: git submodule update --init specs docs
    - name: Set up Rust WASM toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Build WASM test fixtures
      run: |
        ./scripts/build-hara-wasm-raw
        ./scripts/build-crypto-hash-sha256-wasm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
    - name: Verify snapshot version
      run: |
        VERSION=$(mvn -q -f java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
        case "$VERSION" in
          *-SNAPSHOT) ;;
          *) echo "Refusing to publish non-snapshot version: $VERSION" >&2; exit 1 ;;
        esac
    - name: Test and publish snapshot
      run: mvn -B -f java/pom.xml deploy
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
