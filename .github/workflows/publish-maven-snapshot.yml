name: Publish Maven snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish org.hara-lang:hara.lang snapshot
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        server-id: central
        server-username: MAVEN_CENTRAL_USERNAME
        server-password: MAVEN_CENTRAL_PASSWORD
    - name: Verify snapshot version
      run: |
        VERSION=$(mvn -q -f java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
        case "$VERSION" in
          *-SNAPSHOT) ;;
          *) echo "Refusing to publish non-snapshot version: $VERSION" >&2; exit 1 ;;
        esac
    - name: Test and publish snapshot
      run: mvn -B -f java/pom.xml deploy
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
