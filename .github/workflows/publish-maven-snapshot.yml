name: Publish Maven snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish org.hara-lang:hara.lang snapshot
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout hara-specs
      uses: actions/checkout@v4
      with:
        repository: hara-lang/hara-specs
        path: hara-specs
        ref: 3012cbe74edd92b24783f1968a55dcf612c05364
        fetch-depth: 1

    - name: Set up Rust WASM toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Build WASM test fixtures
      run: |
        ./packaging/scripts/build-hara-wasm-raw
        ./packaging/scripts/build-crypto-hash-sha256-wasm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
    - name: Verify snapshot version
      run: |
        VERSION=$(mvn -q -f core/java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
        case "$VERSION" in
          *-SNAPSHOT) ;;
          *) echo "Refusing to publish non-snapshot version: $VERSION" >&2; exit 1 ;;
        esac
    - name: Test and publish snapshot
      run: mvn -B -f core/java/pom.xml deploy
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
