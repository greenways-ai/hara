name: std.db SQLite WASM

on:
  pull_request:
    branches: [main]
    paths:
      - "core/lib/src/std/db.hal"
      - "core/lib/src/std/db/**"
      - "core/lib/test/std/db/**"
      - "core/java/src/test/java/hara/truffle/HaraDbRuntimeTest.java"
      - "core/java/src/test/java/hara/truffle/HaraSqliteProcessExtensionTest.java"
      - "core/rust/extensions/std-db-sqlite/**"
      - "core/rust/web/entries/sqlite-*.mjs"
      - "core/rust/web/packages/db-sqlite/**"
      - "core/rust/web/sqlite-provider.test.mjs"
      - "core/rust/web/vite.sqlite-*.config.js"
      - "core/rust/web/package-db-provider.mjs"
      - "core/rust/web/package-sqlite-extension.mjs"
      - "packaging/scripts/build-db-sqlite-extension"
      - ".github/workflows/std-db-sqlite.yml"
  workflow_dispatch:

concurrency:
  group: std-db-sqlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install Hara web build dependencies
        working-directory: core/rust/web
        run: npm ci
      - name: Install pinned SQLite WASM provider
        working-directory: core/rust/extensions/std-db-sqlite
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Node provider
        working-directory: core/rust/web
        run: ./node_modules/.bin/vite build --config vite.sqlite-node.config.js
      - name: Build browser provider
        working-directory: core/rust/web
        run: ./node_modules/.bin/vite build --config vite.sqlite-browser.config.js
      - name: Execute real SQLite WASM provider test
        working-directory: core/rust/web
        run: node --test sqlite-provider.test.mjs
      - name: Assemble extension package
        working-directory: core/rust/web
        run: node package-sqlite-extension.mjs
      - name: Execute SQLite and database runtimes through Hara
        run: mvn -f core/java/pom.xml -Ptruffle -Dtest=hara.truffle.HaraDbRuntimeTest,hara.truffle.HaraSqliteProcessExtensionTest test
