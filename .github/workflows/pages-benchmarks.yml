name: Deploy benchmarks.hara-lang.org

on:
  push:
    branches: [main]
    paths:
      - benchmarks/**
      - lib/bench/**
      - scripts/build-benchmarks
      - .github/workflows/pages-benchmarks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-hara-benchmarks
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: benchmarks/package-lock.json
      - run: npm ci --prefix benchmarks
      - name: Validate benchmark contracts
        run: |
          npm test --prefix benchmarks
          python3 -m unittest lib/bench/test_validate_evidence.py
      - name: Build standalone benchmark publication
        run: bash scripts/build-benchmarks
      - name: Deploy benchmark publication
        run: npx --yes netlify-cli deploy --prod --dir target/benchmarks --message "benchmarks ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Site IDs are public identifiers. The fallback prevents the CLI
          # from silently creating a fresh site when the optional secret is unset.
          NETLIFY_SITE_ID: ${{ secrets.BENCHMARKS_NETLIFY_SITE_ID || '475f3d36-d586-4267-a38a-af2886743b05' }}
