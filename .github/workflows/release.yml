name: Release hara CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild/release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        fetch-depth: 0
    - name: Resolve tag and verify it matches rust/Cargo.toml
      id: meta
      env:
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      run: |
        TAG="$RELEASE_TAG"
        case "$TAG" in
          v*) ;;
          *) echo "release tag must start with v: $TAG" >&2; exit 1 ;;
        esac
        TAG_REVISION=$(git rev-parse "refs/tags/${TAG}^{commit}")
        REVISION=$(git rev-parse HEAD)
        test "$REVISION" = "$TAG_REVISION"

        VERSION="${TAG#v}"
        CRATE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
        if [ "$VERSION" != "$CRATE_VERSION" ]; then
          echo "tag version '$VERSION' does not match rust/Cargo.toml version '$CRATE_VERSION'" >&2
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
        - { os: macos-13,       target: x86_64-apple-darwin }
        - { os: macos-latest,   target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.guard.outputs.tag }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Build Hara release binary
      run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --bin hara
    - name: Smoke-test binaries
      run: |
        BIN=rust/target/${{ matrix.target }}/release/hara
        OUTPUT=$("$BIN" eval '(+ 19 23)')
        [ "$OUTPUT" = "42" ] || { echo "unexpected eval output: $OUTPUT" >&2; exit 1; }
    - name: Package tarball
      run: |
        TAG="${{ needs.guard.outputs.tag }}"
        DEST="hara-rust-$TAG-${{ matrix.target }}.tar.gz"
        tar -czf "$DEST" -C rust/target/${{ matrix.target }}/release hara
        echo "asset=$DEST" >> "$GITHUB_ENV"
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: ${{ env.asset }}

  build-truffle:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
        - { os: macos-13,       target: x86_64-apple-darwin }
        - { os: macos-latest,   target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      HARA_NATIVE_USE_FALLBACK_RUNTIME: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.guard.outputs.tag }}
    - uses: graalvm/setup-graalvm@v1
      with:
        distribution: graalvm-community
        java-version: '21'
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Truffle native image
      run: |
        ./scripts/build-truffle-native
        OUTPUT=$(target/hara-truffle eval '(+ 19 23)')
        [ "$OUTPUT" = "42" ] || { echo "unexpected Truffle output: $OUTPUT" >&2; exit 1; }
        TAG="${{ needs.guard.outputs.tag }}"
        tar -czf "hara-truffle-$TAG-${{ matrix.target }}.tar.gz" -C target hara-truffle
    - uses: actions/upload-artifact@v4
      with:
        name: release-truffle-${{ matrix.target }}
        path: hara-truffle-*.tar.gz

  build-studio-runtime:
    needs: guard
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.guard.outputs.tag }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Build and verify browser Studio runtime
      run: scripts/build-studio-runtime "${{ needs.guard.outputs.version }}"
    - uses: actions/upload-artifact@v4
      with:
        name: release-studio-runtime
        path: |
          target/studio-runtime/hara-studio-runtime-*.tar.gz
          target/studio-runtime/hara-studio-runtime-*.tar.gz.sha256

  release:
    needs: [guard, build, build-truffle, build-studio-runtime]
    runs-on: ubuntu-latest
    environment: github-release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: dist
        merge-multiple: true
    - name: Create checksums
      run: |
        cd dist
        sha256sum hara-rust-*.tar.gz hara-truffle-*.tar.gz hara-studio-runtime-*.tar.gz > SHA256SUMS
    - name: Create GitHub release
      run: |
        TAG="${{ needs.guard.outputs.tag }}"
        VERSION="${{ needs.guard.outputs.version }}"
        FLAGS=""
        case "$VERSION" in 0.*) FLAGS="--prerelease" ;; esac
        ASSETS=(dist/hara-rust-*.tar.gz dist/hara-truffle-*.tar.gz \
                dist/hara-studio-runtime-*.tar.gz dist/hara-studio-runtime-*.tar.gz.sha256 \
                dist/SHA256SUMS)
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
        else
          gh release create "$TAG" \
            --title "hara $TAG" \
            --notes "GitHub Releases are the publishing authority for Hara runtime packages. Install with:
          
              curl -fsSL https://www.hara-lang.org/install.sh | sh -- --rust --truffle
          " \
            $FLAGS "${ASSETS[@]}"
        fi

  smoke-install:
    needs: [guard, release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.guard.outputs.tag }}
    - name: Install via scripts/install.sh
      run: |
        TAG="${{ needs.guard.outputs.tag }}"
        INSTALL_DIR="$RUNNER_TEMP/hara-bin"
        HARA_VERSION="$TAG" HARA_INSTALL_DIR="$INSTALL_DIR" sh scripts/install.sh --rust --truffle
        RUST_OUTPUT=$("$INSTALL_DIR/hara" eval '(+ 19 23)')
        [ "$RUST_OUTPUT" = "42" ] || { echo "unexpected Rust output: $RUST_OUTPUT" >&2; exit 1; }
        TRUFFLE_OUTPUT=$("$INSTALL_DIR/hara-truffle" eval '(+ 19 23)')
        [ "$TRUFFLE_OUTPUT" = "42" ] || { echo "unexpected Truffle output: $TRUFFLE_OUTPUT" >&2; exit 1; }

  smoke-public-linux-install:
    needs: [guard, release]
    runs-on: ubuntu-latest
    steps:
    - name: Install from the public CLI endpoint into a clean Linux runner
      run: |
        INSTALL_DIR="$RUNNER_TEMP/hara-bin"
        curl -fsSL https://cli.hara-lang.org/install \
          | HARA_VERSION="${{ needs.guard.outputs.tag }}" HARA_INSTALL_DIR="$INSTALL_DIR" sh -s -- --rust --truffle
        RUST_OUTPUT=$("$INSTALL_DIR/hara" eval '(+ 19 23)')
        [ "$RUST_OUTPUT" = "42" ] || { echo "unexpected Rust output: $RUST_OUTPUT" >&2; exit 1; }
        TRUFFLE_OUTPUT=$("$INSTALL_DIR/hara-truffle" eval '(+ 19 23)')
        [ "$TRUFFLE_OUTPUT" = "42" ] || { echo "unexpected Truffle output: $TRUFFLE_OUTPUT" >&2; exit 1; }

  publish-homebrew:
    needs: [guard, release, smoke-install, smoke-public-linux-install]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.guard.outputs.tag }}
    - uses: actions/checkout@v4
      with:
        repository: hara-lang/homebrew-tap
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        path: homebrew-tap
    - name: Download release checksums
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release download "${{ needs.guard.outputs.tag }}" --pattern SHA256SUMS --dir target/homebrew
    - name: Generate and publish formulas
      run: |
        scripts/generate-homebrew-formulas \
          "${{ needs.guard.outputs.tag }}" \
          target/homebrew/SHA256SUMS \
          homebrew-tap/Formula
        cd homebrew-tap
        git diff --check
        if git diff --quiet; then
          echo "Homebrew formulas already match ${{ needs.guard.outputs.tag }}"
          exit 0
        fi
        git config user.name "hara release bot"
        git config user.email "actions@users.noreply.github.com"
        git add Formula/hara.rb Formula/hara-truffle.rb
        git commit -m "hara ${{ needs.guard.outputs.tag }}"
        git push

  publish-greenways-homebrew:
    needs: [guard, release, smoke-install, smoke-public-linux-install]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.GREENWAYS_HOMEBREW_TAP_TOKEN }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.guard.outputs.tag }}
    - name: Render Greenways source formula
      run: |
        python3 scripts/generate-greenways-homebrew-formula \
          "${{ needs.guard.outputs.tag }}" \
          "${{ needs.guard.outputs.revision }}" \
          target/greenways-homebrew/Formula/hara.rb
        ruby -c target/greenways-homebrew/Formula/hara.rb
    - uses: actions/upload-artifact@v4
      with:
        name: greenways-homebrew-formula
        path: target/greenways-homebrew/Formula/hara.rb
    - name: Update Greenways Homebrew tap
      if: ${{ env.TAP_TOKEN != '' }}
      env:
        GH_TOKEN: ${{ env.TAP_TOKEN }}
      run: |
        git clone "https://x-access-token:${GH_TOKEN}@github.com/greenways-ai/homebrew-tap.git" greenways-homebrew-tap
        mkdir -p greenways-homebrew-tap/Formula
        cp target/greenways-homebrew/Formula/hara.rb greenways-homebrew-tap/Formula/hara.rb
        git -C greenways-homebrew-tap diff --check
        if test -z "$(git -C greenways-homebrew-tap status --porcelain -- Formula/hara.rb)"; then
          echo "Greenways tap already contains ${{ needs.guard.outputs.tag }}"
          exit 0
        fi
        git -C greenways-homebrew-tap config user.name "hara release bot"
        git -C greenways-homebrew-tap config user.email "actions@users.noreply.github.com"
        git -C greenways-homebrew-tap add Formula/hara.rb
        git -C greenways-homebrew-tap commit -m "hara ${{ needs.guard.outputs.tag }}"
        git -C greenways-homebrew-tap push
