name: Release hara CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild/release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Resolve tag and verify it matches rust/Cargo.toml
      id: meta
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
          git fetch --tags origin
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
        else
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        VERSION="${TAG#v}"
        CRATE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
        if [ "$VERSION" != "$CRATE_VERSION" ]; then
          echo "tag version '$VERSION' does not match rust/Cargo.toml version '$CRATE_VERSION'" >&2
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
        - { os: macos-13,       target: x86_64-apple-darwin }
        - { os: macos-latest,   target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Build release binary
      run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --bin hara
    - name: Smoke-test binary
      run: |
        BIN=rust/target/${{ matrix.target }}/release/hara
        OUTPUT=$("$BIN" eval '(+ 19 23)')
        [ "$OUTPUT" = "42" ] || { echo "unexpected eval output: $OUTPUT" >&2; exit 1; }
    - name: Package tarball
      run: |
        TAG="${{ needs.guard.outputs.tag }}"
        DEST="hara-rust-$TAG-${{ matrix.target }}.tar.gz"
        tar -czf "$DEST" -C rust/target/${{ matrix.target }}/release hara
        echo "asset=$DEST" >> "$GITHUB_ENV"
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: ${{ env.asset }}

  build-truffle:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
        - { os: macos-13,       target: x86_64-apple-darwin }
        - { os: macos-latest,   target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      HARA_NATIVE_USE_FALLBACK_RUNTIME: 'true'
    steps:
    - uses: actions/checkout@v4
    - uses: graalvm/setup-graalvm@v1
      with:
        distribution: graalvm-community
        java-version: '21'
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Truffle native image
      run: |
        ./scripts/build-truffle-native
        OUTPUT=$(target/hara-truffle eval '(+ 19 23)')
        [ "$OUTPUT" = "42" ] || { echo "unexpected Truffle output: $OUTPUT" >&2; exit 1; }
        TAG="${{ needs.guard.outputs.tag }}"
        tar -czf "hara-truffle-$TAG-${{ matrix.target }}.tar.gz" -C target hara-truffle
    - uses: actions/upload-artifact@v4
      with:
        name: release-truffle-${{ matrix.target }}
        path: hara-truffle-*.tar.gz

  build-studio-runtime:
    needs: guard
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Build and verify browser Studio runtime
      run: scripts/build-studio-runtime "${{ needs.guard.outputs.version }}"
    - uses: actions/upload-artifact@v4
      with:
        name: release-studio-runtime
        path: |
          target/studio-runtime/hara-studio-runtime-*.tar.gz
          target/studio-runtime/hara-studio-runtime-*.tar.gz.sha256

  release:
    needs: [guard, build, build-truffle, build-studio-runtime]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: dist
        merge-multiple: true
    - name: Create checksums
      run: |
        cd dist
        sha256sum hara-rust-*.tar.gz hara-truffle-*.tar.gz hara-studio-runtime-*.tar.gz > SHA256SUMS
    - name: Create GitHub release
      run: |
        TAG="${{ needs.guard.outputs.tag }}"
        VERSION="${{ needs.guard.outputs.version }}"
        FLAGS=""
        case "$VERSION" in 0.*) FLAGS="--prerelease" ;; esac
        ASSETS=(dist/hara-rust-*.tar.gz dist/hara-truffle-*.tar.gz \
                dist/hara-studio-runtime-*.tar.gz dist/hara-studio-runtime-*.tar.gz.sha256 \
                dist/SHA256SUMS)
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
        else
          gh release create "$TAG" \
            --title "hara $TAG" \
            --notes "GitHub Releases are the publishing authority for Hara runtime packages. Install with:
          
              curl -fsSL https://www.hara-lang.org/install.sh | sh -- --rust --truffle
          " \
            $FLAGS "${ASSETS[@]}"
        fi

  smoke-install:
    needs: [guard, release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install via scripts/install.sh
      run: |
        TAG="${{ needs.guard.outputs.tag }}"
        INSTALL_DIR="$RUNNER_TEMP/hara-bin"
        HARA_VERSION="$TAG" HARA_INSTALL_DIR="$INSTALL_DIR" sh scripts/install.sh --rust --truffle
        RUST_OUTPUT=$("$INSTALL_DIR/hara" eval '(+ 19 23)')
        [ "$RUST_OUTPUT" = "42" ] || { echo "unexpected Rust output: $RUST_OUTPUT" >&2; exit 1; }
        TRUFFLE_OUTPUT=$("$INSTALL_DIR/hara-truffle" eval '(+ 19 23)')
        [ "$TRUFFLE_OUTPUT" = "42" ] || { echo "unexpected Truffle output: $TRUFFLE_OUTPUT" >&2; exit 1; }
