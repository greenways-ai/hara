name: Stage observed bytecode implementation

on:
  push:
    branches: [agent/code-vm-observed-step]
    paths:
      - ".github/workflows/code-vm-observed-step-stage.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-vm-observed-step
          fetch-depth: 0

      - name: Install Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Materialize and format
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          workflow = Path(".github/workflows/code-vm-observed-step.yml").read_text()
          opening = "          python3 - <<'PYCODE'\n"
          closing = "\n          PYCODE\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index(closing, start)
          block = workflow[start:end]
          lines = block.splitlines()
          materializer = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"
          Path("/tmp/materialize-observation.py").write_text(materializer)
          PYCODE
          python3 /tmp/materialize-observation.py
          cargo fmt --manifest-path core/rust/Cargo.toml --all

      - name: Commit implementation for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/rust/Cargo.toml \
                  core/rust/src/vm.rs \
                  core/rust/src/vm/frame.rs \
                  core/rust/src/vm/machine.rs \
                  core/rust/src/vm/machine/observation.rs
          git commit -m "Expose observed bytecode machine steps"
          git push
