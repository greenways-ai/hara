name: Materialize bytecode instrumentation integration

on:
  push:
    branches:
      - agent/code-vm-instrumentation

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate bytecode instrumentation module') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-vm-instrumentation
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Add the machine child module and repair the focused fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          machine = Path('core/rust/src/vm/machine.rs')
          text = machine.read_text()
          marker = '''#[cfg(feature = "bytecode-observation")]
          #[path = "machine/observation.rs"]
          pub mod observation;
          '''.replace('          ', '')
          addition = marker + '''
          #[cfg(feature = "bytecode-instrumentation")]
          #[path = "machine/instrumentation.rs"]
          pub mod instrumentation;
          '''.replace('          ', '')
          if 'pub mod instrumentation;' not in text:
              if marker not in text:
                  raise SystemExit('machine observation marker not found')
              text = text.replace(marker, addition, 1)
          machine.write_text(text)

          instrumentation = Path('core/rust/src/vm/machine/instrumentation.rs')
          text = instrumentation.read_text()
          marker = '#[cfg(test)]\nmod tests;'
          replacement = '#[cfg(test)]\n#[path = "instrumentation/tests.rs"]\nmod tests;'
          if replacement not in text:
              if marker not in text:
                  raise SystemExit('instrumentation test marker not found')
              text = text.replace(marker, replacement, 1)
          instrumentation.write_text(text)

          tests = Path('core/rust/src/vm/machine/instrumentation/tests.rs')
          text = tests.read_text()
          old = 'Value::Vector(vec![1.into(), 2.into(), 3.into(), 4.into()].into())'
          new = '''Value::Vector(
              vec![
                  Value::Number(1),
                  Value::Number(2),
                  Value::Number(3),
                  Value::Number(4),
              ]
              .into(),
          )'''
          if old in text:
              text = text.replace(old, new, 1)
          tests.write_text(text)
          PY
      - name: Format and validate the focused instrumentation slice
        run: |
          rustfmt --edition 2021 --config skip_children=true \
            core/rust/src/vm.rs \
            core/rust/src/vm/machine.rs
          rustfmt --edition 2021 --config skip_children=true \
            core/rust/src/vm/machine/instrumentation.rs \
            core/rust/src/vm/machine/instrumentation/tests.rs
          cargo test --manifest-path core/rust/Cargo.toml \
            --lib \
            --features bytecode-instrumentation \
            vm::machine::instrumentation::tests
          cargo clippy --manifest-path core/rust/Cargo.toml \
            --features bytecode-instrumentation \
            --lib --no-deps
          bash core/rust/scripts/check-layout.test.sh
          bash core/rust/scripts/check-layout.sh
      - name: Commit the materialized integration
        run: |
          rm .github/workflows/agent-code-vm-instrumentation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust .github/workflows/agent-code-vm-instrumentation.yml
          git commit -m "Integrate bytecode instrumentation module"
          git push origin HEAD:agent/code-vm-instrumentation
