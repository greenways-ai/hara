name: Materialize bytecode instrumentation integration

on:
  push:
    branches:
      - agent/code-vm-instrumentation

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate bytecode instrumentation module') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-vm-instrumentation
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Add the machine child module and public metric projection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          machine = Path('core/rust/src/vm/machine.rs')
          text = machine.read_text()
          marker = '''#[cfg(feature = "bytecode-observation")]
          #[path = "machine/observation.rs"]
          pub mod observation;
          '''.replace('          ', '')
          addition = marker + '''
          #[cfg(feature = "bytecode-instrumentation")]
          #[path = "machine/instrumentation.rs"]
          pub mod instrumentation;
          '''.replace('          ', '')
          if 'pub mod instrumentation;' not in text:
              if marker not in text:
                  raise SystemExit('machine observation marker not found')
              text = text.replace(marker, addition, 1)
          machine.write_text(text)

          vm = Path('core/rust/src/vm.rs')
          text = vm.read_text()
          old = 'BytecodeMetrics, CounterProbe, EventRing, InstructionEvent, NoProbe, Opcode, SampledProbe,'
          new = 'BytecodeMetrics, CounterProbe, EventRing, InstructionEvent, NoProbe, Opcode, OpcodeCount, SampledProbe,'
          if old in text:
              text = text.replace(old, new, 1)
          vm.write_text(text)
          PY
      - name: Format the focused instrumentation slice
        run: |
          rustfmt --edition 2021 --config skip_children=true \
            core/rust/src/vm.rs \
            core/rust/src/vm/machine.rs
          rustfmt --edition 2021 --config skip_children=true \
            core/rust/src/vm/machine/instrumentation.rs \
            core/rust/src/vm/machine/instrumentation/ring.rs \
            core/rust/src/vm/machine/instrumentation/run.rs \
            core/rust/src/vm/machine/instrumentation/tests.rs
      - name: Test compact instrumentation
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            --lib \
            --features bytecode-instrumentation \
            vm::machine::instrumentation::tests
      - name: Clippy compact instrumentation
        run: |
          cargo clippy --manifest-path core/rust/Cargo.toml \
            --features bytecode-instrumentation \
            --lib --no-deps
      - name: Check Rust module layout
        run: |
          bash core/rust/scripts/check-layout.test.sh
          bash core/rust/scripts/check-layout.sh
      - name: Commit the materialized integration
        run: |
          rm .github/workflows/agent-code-vm-instrumentation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust .github/workflows/agent-code-vm-instrumentation.yml
          git commit -m "Integrate bytecode instrumentation module"
          git push origin HEAD:agent/code-vm-instrumentation
