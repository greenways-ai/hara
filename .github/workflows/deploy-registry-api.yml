name: Deploy Hara registry API

on:
  push:
    branches: [prod]
    paths: [registry-api/**, .github/workflows/deploy-registry-api.yml]
  pull_request:
    branches: [main, prod]
    types: [opened, synchronize, reopened, closed]
    paths: [registry-api/**, .github/workflows/deploy-registry-api.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, '[deploy]'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Deploy preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action != 'closed' &&
          github.event.pull_request.base.ref == 'main'
        run: npx --yes netlify-cli deploy --dir public --functions netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_API_HARA_LANG_ORG_SITE_ID }}
      - name: Deploy production
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'prod')
        run: npx --yes netlify-cli deploy --prod --dir public --functions netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_API_HARA_LANG_ORG_SITE_ID }}
      - name: Verify production OG metadata
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'prod')
        run: |
          page="$(mktemp)"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location --max-time 20 \
                https://api.hara-lang.org/ >"$page" \
              && grep -q 'property="og:image"' "$page" \
              && grep -q 'property="og:image:width" content="3840"' "$page"; then
              echo "Verified the registry API OG metadata."
              exit 0
            fi
            [[ "$attempt" -lt 20 ]] && sleep 15
          done
          echo "api.hara-lang.org did not publish the expected OG metadata." >&2
          exit 1
