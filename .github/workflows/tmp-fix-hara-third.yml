name: Temporary Hara target API repair

on:
  push:
    branches:
      - agent/tahto-hara-self-host

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tahto-hara-self-host
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace unavailable third helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('lib/src/tahto/model/v1/spec_hara/emit.hal'),
              Path('rust/hal-src/tahto/model/v1/spec_hara/emit.hal'),
          ]
          for path in paths:
              text = path.read_text()
              count = text.count('(third ')
              if count == 0:
                  raise SystemExit(f'{path}: no third calls found')
              text = text.replace('(third control)', '(nth control 2)')
              text = text.replace('(third form)', '(nth form 2)')
              if '(third ' in text:
                  raise SystemExit(f'{path}: unhandled third call remains')
              path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/tahto/model/v1/spec_hara/emit.hal rust/hal-src/tahto/model/v1/spec_hara/emit.hal
          git commit -m "Use portable indexing in the Hara target lowerer"
          git push origin HEAD:agent/tahto-hara-self-host
