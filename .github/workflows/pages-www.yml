name: Deploy www.hara-lang.org

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "netlify-www-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify synchronized Hara UI assets
        run: |
          node scripts/sync-hara-ui.mjs
          node scripts/sync-hara-ui.mjs --check
      - name: Build browser runtime and site
        env:
          HARA_GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARA_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/build-www
      - name: Test website scene contract
        run: |
          node --test website/branding.test.mjs website/scene.test.mjs website/editor.test.mjs website/creative.test.mjs
          test -s target/www/og-hara-ribbon.jpg
      - name: Deploy main to www.testing.hara-lang.org
        if: github.ref_name == 'main'
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Deploy production to www.hara-lang.org
        if: github.ref_name == 'production'
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "production ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
