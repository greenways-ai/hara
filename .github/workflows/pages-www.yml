name: Deploy www.hara-lang.org

on:
  push:
    branches: [prod]
    paths:
      - 'website/**'
      - 'benchmarks/**'
      - 'rust/**'
      - 'lib/**'
      - 'scripts/build-www'
      - 'scripts/sync-hara-ui.mjs'
      - '.github/workflows/pages-www.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'benchmarks/**'
      - 'rust/**'
      - 'lib/**'
      - 'scripts/build-www'
      - 'scripts/sync-hara-ui.mjs'
      - '.github/workflows/pages-www.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: netlify-www-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify synchronized Hara UI assets
        run: |
          node scripts/sync-hara-ui.mjs
          node scripts/sync-hara-ui.mjs --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            benchmarks/package-lock.json
      - name: Install Astro site dependencies
        run: |
          npm ci --prefix website
          npm ci --prefix benchmarks
      - name: Build browser runtime and site
        env:
          HARA_GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARA_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/build-www
      - name: Test website scene contract
        run: |
          npm test --prefix website
          npm test --prefix benchmarks
          node --test website/scene.test.mjs website/editor.test.mjs website/creative.test.mjs
          test -s target/www/og-hara-ribbon.jpg
      - name: Deploy prod to www.testing.hara-lang.org
        if: github.ref == 'refs/heads/prod'
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "prod ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Deploy production to www.hara-lang.org
        if: github.ref == 'refs/heads/prod'
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "prod ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
