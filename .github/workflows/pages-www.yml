name: Deploy www.hara-lang.org

on:
  push:
    branches: [prod]
    paths:
      - 'website/**'
      - 'benchmarks/**'
      - 'rust/**'
      - 'lib/**'
      - 'scripts/build-www'
      - 'scripts/install-benchmark-site'
      - 'scripts/write-kernel-manifest.mjs'
      - 'scripts/sync-hara-ui.mjs'
      - '.github/scripts/reconcile-netlify-domain.sh'
      - '.github/scripts/verify-benchmark-observatory.sh'
      - '.github/workflows/pages-www.yml'
  pull_request:
    branches: [prod]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, '[deploy]'))
    concurrency:
      group: netlify-www-prod
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Checkout validated benchmark observatory
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: benchmark-site
          path: .benchmark-site
          fetch-depth: 1
      - name: Verify synchronized Hara UI assets
        run: |
          node scripts/sync-hara-ui.mjs
          node scripts/sync-hara-ui.mjs --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install Astro site dependencies
        run: |
          npm ci --prefix website
          npm ci --prefix benchmarks
      - name: Build browser runtime and site
        env:
          HARA_GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARA_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/build-www
          bash scripts/install-benchmark-site
      - name: Test website scene contract
        run: |
          npm test --prefix website
          node --test website/scene.test.mjs website/editor.test.mjs website/creative.test.mjs
          test -s target/www/og-hara.jpg
          test -s target/www/benchmarks/index.html
          test -s target/www/benchmarks/data/catalog.json
          test -s target/www/benchmarks/data/runs.json
          grep -F '<title>Hara Performance Observatory</title>' target/www/benchmarks/index.html
          grep -F 'Language shootout' target/www/benchmarks/index.html
          grep -F '"rust"' target/www/benchmarks/data/catalog.json
          grep -F '"runtime":"rust-prepared"' target/www/benchmarks/data/runs.json
      - name: Deploy prod to www.testing.hara-lang.org
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "prod ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Reconcile the testing domain
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: www.testing.hara-lang.org
          NETLIFY_HEALTH_URLS: https://www.testing.hara-lang.org/
      - name: Verify the testing benchmark observatory
        run: bash .github/scripts/verify-benchmark-observatory.sh https://www.testing.hara-lang.org/benchmarks/
      - name: Deploy production to www.hara-lang.org
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "prod ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Reconcile the production domains
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: www.hara-lang.org
          NETLIFY_DOMAIN_ALIASES: hara-lang.org docs.hara-lang.org
          NETLIFY_HEALTH_URLS: https://www.hara-lang.org/ https://www.hara-lang.org/docs/
      - name: Verify the production benchmark observatory
        run: bash .github/scripts/verify-benchmark-observatory.sh https://www.hara-lang.org/benchmarks/
