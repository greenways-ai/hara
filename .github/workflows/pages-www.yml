name: Deploy www.hara-lang.org

on:
  push:
    branches: [main, prod]
    paths:
      - 'benchmarks/**'
      - 'core/rust/**'
      - 'core/lib/**'
      - 'packaging/scripts/build-www'
      - 'packaging/scripts/install-benchmark-site'
      - 'packaging/scripts/write-kernel-manifest.mjs'
      - '.github/scripts/verify-benchmark-observatory.sh'
      - '.github/workflows/pages-www.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: netlify-www-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout validated benchmark evidence
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: benchmark-site
          path: .benchmark-site
          fetch-depth: 1
      - name: Checkout reviewed hara-docs release
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-docs
          ref: 563edc868ebd3bca018f6102f706a6600b5d0722
          path: website/docs
          fetch-depth: 1
      - name: Checkout reviewed visual-language release
        uses: actions/checkout@v4
        with:
          repository: hara-lang/visual-language
          ref: a4db9548bdcad7887824890b0bb259da26e402c7
          path: packages/visual-language
          fetch-depth: 1
          persist-credentials: false
      - name: Remove the vendored hara-www snapshot
        run: rm -rf website/hara-www
      - name: Checkout reviewed hara-www popup release
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-www
          ref: 320aed54f40d4d85d3140fdc67b13144516bea58
          path: website/hara-www
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Link reviewed dependencies into the nested www workspace
        run: |
          mkdir -p website/packages
          rm -rf website/packages/visual-language
          ln -s ../../packages/visual-language website/packages/visual-language
          rm -rf website/rust
          ln -s ../core/rust website/rust
          mkdir -p website/lib
          rm -rf website/lib/bench
          ln -s ../../core/lib/bench website/lib/bench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/hara-www/package-lock.json
            benchmarks/package-lock.json
      - name: Install Astro site dependencies
        run: |
          npm ci --prefix website/hara-www
          npm ci --prefix benchmarks
      - name: Build browser runtime and Astro sites
        env:
          HARA_GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARA_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          rustup target add wasm32-unknown-unknown
          bash packaging/scripts/install-benchmark-site prepare
          bash packaging/scripts/build-www
          bash packaging/scripts/install-benchmark-site publish
      - name: Test website scene and Astro benchmark contracts
        run: |
          npm test --prefix website/hara-www
          node --test website/hara-www/scene.test.mjs website/hara-www/editor.test.mjs website/hara-www/creative.test.mjs
          test -s core/target/www/og-hara.jpg
          test -s core/target/www/benchmarks/index.html
          test -s core/target/www/benchmarks/data/catalog.json
          test -s core/target/www/benchmarks/data/runs.json
          grep -F '<meta name="hara-identity-mode" content="popup"' core/target/www/index.html
          grep -F '<meta name="hara-identity-auto" content="starlight"' core/target/www/docs/start/orientation/index.html
          grep -F '<title>Hara Benchmarks</title>' core/target/www/benchmarks/index.html
          grep -F 'id="class-comparison"' core/target/www/benchmarks/index.html
          grep -F 'id="language-shootout"' core/target/www/benchmarks/index.html
          grep -F 'rust-prepared' core/target/www/benchmarks/index.html
          grep -F '"rust"' core/target/www/benchmarks/data/catalog.json
          grep -F '"runtime":"rust-prepared"' core/target/www/benchmarks/data/runs.json
      - name: Deploy candidate to www.testing.hara-lang.org
        run: npx --yes netlify-cli deploy --prod --dir core/target/www --message "${GITHUB_REF_NAME} ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Verify the testing Astro benchmark site
        run: bash .github/scripts/verify-benchmark-observatory.sh https://www.testing.hara-lang.org/benchmarks/
      - name: Deploy prod to www.hara-lang.org
        if: github.ref_name == 'prod'
        run: npx --yes netlify-cli deploy --prod --dir core/target/www --message "prod ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Correct the production domain
        if: github.ref_name == 'prod'
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"custom_domain":"www.hara-lang.org","force_ssl":true}' \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Verify the production Astro benchmark site
        if: github.ref_name == 'prod'
        run: bash .github/scripts/verify-benchmark-observatory.sh https://www.hara-lang.org/benchmarks/
