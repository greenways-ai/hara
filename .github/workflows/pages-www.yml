name: Deploy www.hara-lang.org

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build browser runtime and site
        env:
          HARA_GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARA_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/build-www
      - name: Test website scene contract
        run: node --test website/scene.test.mjs website/editor.test.mjs website/creative.test.mjs
      - name: Configure custom domain
        run: echo "www.hara-lang.org" > ./target/www/CNAME
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: ""
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./target/www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
