name: Deploy www.hara-lang.org

on:
  push:
    branches: [prod]
    paths:
      - 'website/**'
      - 'benchmarks/**'
      - 'rust/**'
      - 'lib/**'
      - 'scripts/build-www'
      - 'scripts/install-benchmark-site'
      - 'scripts/install-www-redirects'
      - 'scripts/write-kernel-manifest.mjs'
      - 'scripts/sync-hara-ui.mjs'
      - '.github/scripts/verify-benchmark-observatory.sh'
      - '.github/workflows/pages-www.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: netlify-www-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Checkout validated benchmark evidence
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: benchmark-site
          path: .benchmark-site
          fetch-depth: 1
      - name: Checkout reviewed Hara website
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-www
          ref: 3acd4ecfd024ef48320239751e89c80b81fd25d0
          path: .hara-www-release
          fetch-depth: 1
      - name: Sync reviewed website into the production snapshot
        run: |
          mkdir -p website/public/assets website/src/layouts website/src/pages website/test
          cp .hara-www-release/src/pages/index.astro website/src/pages/index.astro
          cp .hara-www-release/src/layouts/SiteLayout.astro website/src/layouts/SiteLayout.astro
          cp .hara-www-release/public/assets/install-copy.js website/public/assets/install-copy.js
          cp .hara-www-release/public/assets/install-copy.css website/public/assets/install-copy.css
          cp .hara-www-release/test/install-copy.test.mjs website/test/install-copy.test.mjs
      - name: Verify synchronized Hara UI assets
        run: |
          node scripts/sync-hara-ui.mjs
          node scripts/sync-hara-ui.mjs --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install Astro site dependencies
        run: |
          npm ci --prefix website
          npm ci --prefix benchmarks
      - name: Build browser runtime and Astro sites
        env:
          HARA_GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARA_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/install-benchmark-site prepare
          bash scripts/build-www
          bash scripts/install-benchmark-site publish
          bash scripts/install-www-redirects target/www
      - name: Test website scene and Astro benchmark contracts
        run: |
          set -Eeuo pipefail

          assert_file() {
            local file="$1"
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing or empty required file"
              exit 1
            fi
            echo "verified file: $file"
          }

          assert_contains() {
            local file="$1"
            local needle="$2"
            if ! grep -Fq -- "$needle" "$file"; then
              echo "::error file=$file::Missing expected text: $needle"
              exit 1
            fi
            echo "verified text in $file: $needle"
          }

          assert_absent_regex() {
            local file="$1"
            local pattern="$2"
            if grep -Eq -- "$pattern" "$file"; then
              echo "::error file=$file::Unexpected pattern: $pattern"
              exit 1
            fi
            echo "verified absent from $file: $pattern"
          }

          npm test --prefix website
          node --test website/scene.test.mjs website/editor.test.mjs website/creative.test.mjs
          node --check website/public/assets/install-copy.js

          assert_file target/www/og-hara.jpg
          assert_file target/www/benchmarks/index.html
          assert_file target/www/benchmarks/data/catalog.json
          assert_file target/www/benchmarks/data/runs.json
          assert_file target/www/_headers
          assert_file target/www/_redirects
          assert_file target/www/assets/install-copy.js
          assert_file target/www/assets/install-copy.css

          assert_contains target/www/benchmarks/index.html '<title>Hara Benchmarks</title>'
          assert_contains target/www/benchmarks/index.html 'id="class-comparison"'
          assert_contains target/www/benchmarks/index.html 'id="language-shootout"'
          assert_contains target/www/benchmarks/index.html 'rust-prepared'
          assert_contains target/www/benchmarks/data/catalog.json '"rust"'
          assert_contains target/www/benchmarks/data/runs.json '"runtime":"rust-prepared"'
          assert_contains target/www/_headers '/benchmarks/*'
          assert_absent_regex target/www/_redirects '(^[[:space:]]*/benchmarks|benchmarks\.hara-lang\.org)'
          assert_contains target/www/index.html 'brew install hara-lang/tap/hara'
          assert_contains target/www/index.html 'https://playground.hara-lang.org/'
          assert_contains target/www/index.html '/assets/install-copy.js'
          assert_contains target/www/index.html '/assets/install-copy.css'
          assert_contains target/www/assets/install-copy.js 'Copy Homebrew install command'
      - name: Deploy prod to www.testing.hara-lang.org
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "prod ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Verify the testing Astro benchmark site
        run: bash .github/scripts/verify-benchmark-observatory.sh https://www.testing.hara-lang.org/benchmarks/
      - name: Deploy production to www.hara-lang.org
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "prod ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Correct the production domain
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"custom_domain":"www.hara-lang.org","force_ssl":true}' \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Verify the production Astro benchmark site
        run: bash .github/scripts/verify-benchmark-observatory.sh https://www.hara-lang.org/benchmarks/
