name: Deploy hara-lang.org

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: "netlify-www-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify synchronized Hara UI assets
        run: |
          node scripts/sync-hara-ui.mjs
          node scripts/sync-hara-ui.mjs --check
      - name: Build browser runtime and site
        if: github.ref_name == 'main'
        env:
          HARA_GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARA_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/build-www
      - name: Restore verified production kernel
        if: github.ref_name == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/www-artifact target/www
          gh run download 30617918533 -n github-pages -D target/www-artifact
          echo "325855873453b7ab7b0a3483c5e6b51b2e104377787bd10ee5e001d9da27aa4b  target/www-artifact/artifact.tar" | shasum -a 256 -c -
          tar -xf target/www-artifact/artifact.tar -C target/www
      - name: Test website scene contract
        run: |
          node --test website/branding.test.mjs website/scene.test.mjs website/editor.test.mjs website/creative.test.mjs
          test -s target/www/og-hara-ribbon.jpg
      - name: Package verified production candidate
        if: github.ref_name == 'main'
        run: |
          mkdir -p target/www-artifact
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf target/www-artifact/artifact.tar -C target/www .
          shasum -a 256 target/www-artifact/artifact.tar
      - name: Upload verified production candidate
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: www-production-candidate
          path: target/www-artifact/artifact.tar
          if-no-files-found: error
          retention-days: 30
      - name: Deploy main to www.testing.hara-lang.org
        if: github.ref_name == 'main'
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Deploy production to hara-lang.org
        if: github.ref_name == 'production'
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "production ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
