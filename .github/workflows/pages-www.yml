name: Deploy www.hara-lang.org

on:
  push:
    branches: [prod]
    paths:
      - 'website/**'
      - 'benchmarks/**'
      - 'rust/**'
      - 'lib/**'
      - 'scripts/build-www'
      - 'scripts/install-benchmark-site'
      - 'scripts/install-www-redirects'
      - 'scripts/write-kernel-manifest.mjs'
      - 'scripts/sync-hara-ui.mjs'
      - '.github/scripts/verify-benchmark-observatory.sh'
      - '.github/scripts/verify-shared-identity.sh'
      - '.github/workflows/pages-www.yml'
  workflow_dispatch:
    inputs:
      promote_production:
        description: Promote the exact tested prod commit to www.hara-lang.org
        required: true
        default: false
        type: boolean
      tested_sha:
        description: Exact 40-character prod commit already verified on www.testing.hara-lang.org
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: netlify-www-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_name: ${{ steps.source.outputs.artifact }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tested_sha != '' && inputs.tested_sha || github.sha }}
          fetch-depth: 0
          submodules: true
      - name: Validate production promotion request
        if: github.event_name == 'workflow_dispatch' && inputs.promote_production == true
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF_NAME" != "prod" ]]; then
            echo 'Production promotion must be dispatched from the prod branch.' >&2
            exit 1
          fi
          if [[ ! "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'tested_sha must be an exact lowercase 40-character commit SHA.' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            echo 'The checked-out source does not match tested_sha.' >&2
            exit 1
          fi
          remote_prod="$(git ls-remote origin refs/heads/prod | cut -f1)"
          if [[ "$remote_prod" != "$TESTED_SHA" ]]; then
            echo 'tested_sha is no longer the current prod head; test the new prod head before promotion.' >&2
            exit 1
          fi
      - name: Record immutable source
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=hara-www-$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout validated benchmark evidence
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: benchmark-site
          path: .benchmark-site
          fetch-depth: 1
      - name: Checkout reviewed Hara website
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-www
          ref: 3acd4ecfd024ef48320239751e89c80b81fd25d0
          path: .hara-www-release
          fetch-depth: 1
      - name: Sync reviewed homepage and copy assets into the production snapshot
        run: |
          mkdir -p website/public/assets website/src/pages website/test
          cp .hara-www-release/src/pages/index.astro website/src/pages/index.astro
          cp .hara-www-release/public/assets/install-copy.js website/public/assets/install-copy.js
          cp .hara-www-release/public/assets/install-copy.css website/public/assets/install-copy.css
          cp .hara-www-release/test/install-copy.test.mjs website/test/install-copy.test.mjs
      - name: Verify synchronized Hara UI assets
        run: |
          node scripts/sync-hara-ui.mjs
          node scripts/sync-hara-ui.mjs --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install Astro site dependencies
        run: |
          npm ci --prefix website
          npm ci --prefix benchmarks
      - name: Build browser runtime and Astro sites
        env:
          HARA_GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARA_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/install-benchmark-site prepare
          bash scripts/build-www
          bash scripts/install-benchmark-site publish
          bash scripts/install-www-redirects target/www
      - name: Test website source contracts
        run: |
          npm test --prefix website
          node --test website/scene.test.mjs website/editor.test.mjs website/creative.test.mjs
          node --check website/public/assets/install-copy.js
          node --check website/public/assets/identity-loader.js
      - name: Verify generated website files
        run: |
          set -Eeuo pipefail
          test -s target/www/og-hara.jpg
          test -s target/www/benchmarks/index.html
          test -s target/www/benchmarks/data/catalog.json
          test -s target/www/benchmarks/data/runs.json
          test -s target/www/_headers
          test -e target/www/_redirects
          test -s target/www/assets/install-copy.js
          test -s target/www/assets/install-copy.css
          test -s target/www/assets/identity-loader.js
      - name: Verify generated benchmark contracts
        run: |
          set -Eeuo pipefail
          grep -Fq '<title>Hara Benchmarks</title>' target/www/benchmarks/index.html
          grep -Fq 'id="class-comparison"' target/www/benchmarks/index.html
          grep -Fq 'id="language-shootout"' target/www/benchmarks/index.html
          grep -Fq 'rust-prepared' target/www/benchmarks/index.html
          grep -Fq '"rust"' target/www/benchmarks/data/catalog.json
          grep -Fq '"runtime":"rust-prepared"' target/www/benchmarks/data/runs.json
          grep -Fq '/benchmarks/*' target/www/_headers
      - name: Verify generated redirect contracts
        run: |
          set -Eeuo pipefail
          ! grep -Eq '(^[[:space:]]*/benchmarks|benchmarks\.hara-lang\.org)' target/www/_redirects
      - name: Verify generated install copy control
        run: |
          set -Eeuo pipefail
          grep -Fq 'brew install hara-lang/tap/hara' target/www/index.html
          grep -Fq 'https://playground.hara-lang.org/' target/www/index.html
          grep -Fq '/assets/install-copy.js' target/www/index.html
          grep -Fq '/assets/install-copy.css' target/www/index.html
          grep -Fq 'Copy Homebrew install command' target/www/assets/install-copy.js
      - name: Verify generated popup identity shell
        run: |
          set -Eeuo pipefail
          grep -Fq '<meta name="hara-identity-mode" content="popup"' target/www/index.html
          grep -Fq 'data-hara-identity' target/www/index.html
          grep -Fq 'data-hara-identity-fallback' target/www/index.html
          grep -Fq '/assets/identity-loader.js' target/www/index.html
          grep -Fq 'hara-identity-auto' target/www/docs/start/orientation/index.html
          grep -Fq '/assets/identity-loader.js' target/www/docs/start/orientation/index.html
          grep -Fq '/v1/identity-client.js' target/www/assets/identity-loader.js
          if grep -R -E 'HARA_GITHUB_OAUTH_CLIENT_SECRET|HARA_AUTH_SESSION_SECRET|/auth/github/callback' target/www; then
            echo 'The www artifact must not contain Identity secrets or a local OAuth callback.' >&2
            exit 1
          fi
      - name: Upload immutable website artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: target/www
          if-no-files-found: error
          retention-days: 3

  deploy-testing:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 1
      - name: Download immutable website artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: target/www
      - name: Deploy candidate to www.testing.hara-lang.org
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "tested ${{ needs.build.outputs.source_sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Verify the testing Astro benchmark site
        run: bash .github/scripts/verify-benchmark-observatory.sh https://www.testing.hara-lang.org/benchmarks/
      - name: Verify testing shared identity
        run: bash .github/scripts/verify-shared-identity.sh
        env:
          HARA_SITE_ORIGIN: https://www.testing.hara-lang.org
          HARA_IDENTITY_ORIGIN: https://id.testing.hara-lang.org

  deploy-production:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.promote_production == true) ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[deploy]'))
    needs: [build, deploy-testing]
    runs-on: ubuntu-latest
    environment:
      name: hara-www-production
      url: https://www.hara-lang.org
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 1
      - name: Download the tested website artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: target/www
      - name: Deploy tested artifact to www.hara-lang.org
        run: npx --yes netlify-cli deploy --prod --dir target/www --message "production ${{ needs.build.outputs.source_sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Correct the production domain
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"custom_domain":"www.hara-lang.org","force_ssl":true}' \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Verify the production Astro benchmark site
        run: bash .github/scripts/verify-benchmark-observatory.sh https://www.hara-lang.org/benchmarks/
      - name: Verify production shared identity
        run: bash .github/scripts/verify-shared-identity.sh
        env:
          HARA_SITE_ORIGIN: https://www.hara-lang.org
          HARA_IDENTITY_ORIGIN: https://id.hara-lang.org
