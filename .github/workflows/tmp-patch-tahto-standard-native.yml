name: Temporary Tahto standard native patch

on:
  push:
    branches:
      - agent/tahto-standard-native-facade

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tahto-standard-native-facade
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch the Hara target onto the Tahto standard facade
        run: python3 scripts/patch-tahto-standard-native.py
      - name: Remove the superseded target-specific facade and patch machinery
        run: |
          git rm \
            lib/src/tahto/runtime/hara.hal \
            rust/hal-src/tahto/runtime/hara.hal \
            scripts/patch-tahto-standard-native.py \
            .github/workflows/tmp-patch-tahto-standard-native.yml
      - name: Commit the standard native mapping
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Map Hara XTalk collections through tahto.runtime.standard"
          git push origin HEAD:agent/tahto-standard-native-facade
