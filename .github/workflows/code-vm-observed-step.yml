name: Materialize observed bytecode stepping

on:
  push:
    branches: [agent/code-vm-observed-step]
    paths:
      - ".github/workflows/code-vm-observed-step.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-vm-observed-step
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Add opt-in observed stepping
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          import gzip

          observation = gzip.decompress(base64.b64decode(""))
          observation_path = Path("core/rust/src/vm/machine/observation.rs")
          observation_path.parent.mkdir(parents=True, exist_ok=True)
          observation_path.write_bytes(observation)

          machine_path = Path("core/rust/src/vm/machine.rs")
          machine = machine_path.read_text()

          module_anchor = '''#[path = "machine/globals.rs"]
          mod globals;
          '''.replace("          ", "")
          module_replacement = '''#[path = "machine/globals.rs"]
          mod globals;

          #[cfg(feature = "bytecode-observation")]
          #[path = "machine/observation.rs"]
          mod observation;
          #[cfg(feature = "bytecode-observation")]
          pub use observation::{
              CallFrameSnapshot, HandlerSnapshot, InstructionOperand, InstructionSnapshot,
              MachineObservationStatus, MachineSnapshot, ObservationEventKind,
              ObservationEventStatus, ObservationLimits, ObservedStep, ObservedStepOutcome,
              ProgramSnapshot, SourcePositionSnapshot, ValueSnapshot, BYTECODE_TRACE_SCHEMA,
          };
          '''.replace("          ", "")
          assert module_anchor in machine, "machine module anchor changed"
          machine = machine.replace(module_anchor, module_replacement, 1)

          dispatch_anchor = '''enum Dispatch {
              Next(usize),
          '''.replace("          ", "")
          dispatch_replacement = '''enum Dispatch {
              Next(usize),
              Unwound(usize),
          '''.replace("          ", "")
          assert dispatch_anchor in machine, "Dispatch anchor changed"
          machine = machine.replace(dispatch_anchor, dispatch_replacement, 1)

          raised = "Ok(target) => return Dispatch::Next(target),"
          raised_count = machine.count(raised)
          assert raised_count >= 10, f"expected dispatch unwind sites, found {raised_count}"
          machine = machine.replace(raised, "Ok(target) => return Dispatch::Unwound(target),")

          call_anchor = '''                Dispatch::Call { callee, args } => {
          '''.replace("          ", "")
          unwind_arm = '''                Dispatch::Unwound(ip) => {
                      #[cfg(feature = "tracing-jit")]
                      {
                          self.jit_path.clear();
                          self.jit_loop_entries.clear();
                      }
                      self.ip = ip;
                  }
                  Dispatch::Call { callee, args } => {
          '''.replace("          ", "")
          assert call_anchor in machine, "run-loop call arm changed"
          machine = machine.replace(call_anchor, unwind_arm, 1)
          machine_path.write_text(machine)

          frame_path = Path("core/rust/src/vm/frame.rs")
          frame = frame_path.read_text()
          frame_anchor = '''    /// Operand-stack base at which this frame was entered.
              pub(crate) fn base(&self) -> usize {
          '''.replace("              ", "    ")
          frame_replacement = '''    /// Borrowed local slots for bounded machine observations.
              pub(crate) fn locals(&self) -> &[VmSlot] {
                  &self.locals
              }

              /// Operand-stack base at which this frame was entered.
              pub(crate) fn base(&self) -> usize {
          '''.replace("              ", "    ")
          assert frame_anchor in frame, "frame base anchor changed"
          frame_path.write_text(frame.replace(frame_anchor, frame_replacement, 1))

          cargo_path = Path("core/rust/Cargo.toml")
          cargo = cargo_path.read_text()
          cargo_anchor = '''bytecode-vm = []
          tracing-jit = ["bytecode-vm"]
          '''.replace("          ", "")
          cargo_replacement = '''bytecode-vm = []
          # Opt-in bounded snapshots and one-boundary stepping for Hodos/code.vm.
          bytecode-observation = ["bytecode-vm"]
          tracing-jit = ["bytecode-vm"]
          '''.replace("          ", "")
          assert cargo_anchor in cargo, "Cargo feature anchor changed"
          cargo_path.write_text(cargo.replace(cargo_anchor, cargo_replacement, 1))

          vm_path = Path("core/rust/src/vm.rs")
          vm = vm_path.read_text()
          vm_anchor = '''pub use machine::{execute_program, execute_program_with_globals, Machine, VmOutcome};
          pub use opcode::Instruction;
          '''.replace("          ", "")
          vm_replacement = '''pub use machine::{execute_program, execute_program_with_globals, Machine, VmOutcome};
          #[cfg(feature = "bytecode-observation")]
          pub use machine::{
              CallFrameSnapshot, HandlerSnapshot, InstructionOperand, InstructionSnapshot,
              MachineObservationStatus, MachineSnapshot, ObservationEventKind,
              ObservationEventStatus, ObservationLimits, ObservedStep, ObservedStepOutcome,
              ProgramSnapshot, SourcePositionSnapshot, ValueSnapshot, BYTECODE_TRACE_SCHEMA,
          };
          pub use opcode::Instruction;
          '''.replace("          ", "")
          assert vm_anchor in vm, "vm re-export anchor changed"
          vm_path.write_text(vm.replace(vm_anchor, vm_replacement, 1))
          PYCODE

          cargo fmt --manifest-path core/rust/Cargo.toml --all

      - name: Run observed stepping tests
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            --features bytecode-observation \
            vm::machine::observation::tests

      - name: Reject observation warnings
        run: |
          cargo clippy --manifest-path core/rust/Cargo.toml \
            --features bytecode-observation \
            --lib -- -D warnings

      - name: Commit materialized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/rust/Cargo.toml \
                  core/rust/src/vm.rs \
                  core/rust/src/vm/frame.rs \
                  core/rust/src/vm/machine.rs \
                  core/rust/src/vm/machine/observation.rs
          git commit -m "Expose observed bytecode machine steps"
          git push
