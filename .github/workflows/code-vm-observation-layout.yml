name: Validate bytecode observation layout v3

on:
  push:
    branches: [agent/code-vm-observed-step]
    paths:
      - ".github/workflows/code-vm-observation-layout.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-vm-observed-step
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Place compile-time fixtures
        run: |
          rm -rf "$GITHUB_WORKSPACE/../hara-specs-registry"
          ln -s "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Split observation implementation
        run: python3 .github/scripts/split-bytecode-observation.py

      - name: Format
        run: |
          cargo fmt --manifest-path core/rust/Cargo.toml --all
          cargo fmt --manifest-path core/rust/Cargo.toml --all -- --check

      - name: Enforce Rust layout
        run: |
          bash core/rust/scripts/check-layout.test.sh
          bash core/rust/scripts/check-layout.sh

      - name: Run focused tests
        run: cargo test --manifest-path core/rust/Cargo.toml --features bytecode-observation vm::machine::observation::tests

      - name: Check observation-enabled library
        run: cargo clippy --manifest-path core/rust/Cargo.toml --features bytecode-observation --lib --no-deps

      - name: Commit layout-compliant observation modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/rust/src/vm.rs \
                  core/rust/src/vm/machine.rs \
                  core/rust/src/vm/machine/observation.rs \
                  core/rust/src/vm/machine/observation/project.rs \
                  core/rust/src/vm/machine/observation/tests.rs
          git commit -m "Split bytecode observation into bounded modules"
          git push
