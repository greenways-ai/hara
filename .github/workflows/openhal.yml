name: OpenHAL

on:
  pull_request:
    paths:
      - 'openhal/**'
      - '.github/workflows/openhal.yml'
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test OpenHAL runtime bridge
        run: cargo test --manifest-path openhal/runtime/Cargo.toml

  nginx-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenHAL runtime and Nginx dynamic module
        run: docker build -f openhal/docker/Dockerfile -t openhal-ci .
