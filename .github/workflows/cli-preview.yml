name: Publish CLI preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag in hara-lang/hara
        required: true
        default: main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
        - { os: macos-13, target: x86_64-apple-darwin }
        - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with: { ref: ${{ inputs.ref }} }
    - uses: dtolnay/rust-toolchain@stable
      with: { targets: ${{ matrix.target }} }
    - run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --bin hara
    - run: |
        SHORT_SHA=$(git rev-parse --short=12 HEAD)
        tar -czf "hara-rust-preview-$SHORT_SHA-${{ matrix.target }}.tar.gz" -C rust/target/${{ matrix.target }}/release hara
    - uses: actions/upload-artifact@v4
      with: { name: preview-${{ matrix.target }}, path: hara-rust-preview-*.tar.gz }

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: { ref: ${{ inputs.ref }} }
    - uses: actions/download-artifact@v4
      with: { pattern: preview-*, path: dist, merge-multiple: true }
    - uses: actions/create-github-app-token@v2
      id: publish-token
      with:
        app-id: ${{ secrets.HARA_CLI_APP_ID }}
        private-key: ${{ secrets.HARA_CLI_APP_PRIVATE_KEY }}
        owner: hara-lang
        repositories: hara-cli
    - env: { GH_TOKEN: ${{ steps.publish-token.outputs.token }} }
      run: |
        SHORT_SHA=$(git rev-parse --short=12 HEAD)
        TAG="preview-$SHORT_SHA"
        printf 'source-repository: hara-lang/hara\nsource-commit: %s\n' "$(git rev-parse HEAD)" > dist/HARA-SOURCE
        (cd dist && sha256sum hara-rust-*.tar.gz > SHA256SUMS)
        gh release create "$TAG" --repo hara-lang/hara-cli --prerelease --title "Hara preview $SHORT_SHA" --notes "Preview built from hara-lang/hara $(git rev-parse HEAD)." dist/* --clobber
