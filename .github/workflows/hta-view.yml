name: Borrowed HTA frame view

on:
  pull_request:
    paths:
      - ".github/workflows/hta-view.yml"
      - "core/rust/hta-codec/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hta-view.yml"
      - "core/rust/hta-codec/**"

permissions:
  contents: write

jobs:
  hta-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt,clippy
      - name: Materialize the public module and formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/rust/hta-codec/src/lib.rs")
          source = path.read_text()
          declaration = "pub mod view;\n\n"
          if declaration not in source:
              path.write_text(declaration + source)
          PY
          cargo fmt --manifest-path core/rust/hta-codec/Cargo.toml --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/rust/hta-codec
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expose and format borrowed HTA frame views"
          git push
      - name: Reject warnings
        run: cargo clippy --manifest-path core/rust/hta-codec/Cargo.toml --all-targets -- -D warnings
      - name: Run borrowed frame conformance
        run: cargo test --manifest-path core/rust/hta-codec/Cargo.toml --all-targets
