name: Site CI

on:
  pull_request:
    paths:
      - "website/**"
      - "benchmarks/**"
      - "lib/bench/**"
      - "packages/visual-language/**"
      - "scripts/install-benchmark-site"
      - ".github/scripts/verify-benchmark-observatory.sh"
      - ".github/workflows/site-ci.yml"
      - ".github/workflows/pages-www.yml"

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Checkout validated benchmark evidence
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: benchmark-site
          path: .benchmark-site
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            benchmarks/package-lock.json
      - name: Install site dependencies
        run: |
          npm ci --prefix website
          npm ci --prefix benchmarks
      - name: Prepare canonical evidence for Astro
        run: bash scripts/install-benchmark-site prepare
      - name: Validate benchmark publication
        run: |
          npm test --prefix benchmarks
          npm run build --prefix benchmarks
          test -s target/benchmarks/index.html
          grep -F '<title>Hara Benchmarks</title>' target/benchmarks/index.html
          grep -F 'id="class-comparison"' target/benchmarks/index.html
          grep -F 'id="language-shootout"' target/benchmarks/index.html
          grep -F 'rust-prepared' target/benchmarks/index.html
      - name: Validate main Hara site
        run: |
          npm test --prefix website
          npm run build --prefix website
