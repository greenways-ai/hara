name: Site CI

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "core/lib/bench/**"
      - "packages/visual-language/**"
      - "packaging/scripts/install-benchmark-site"
      - ".github/scripts/verify-benchmark-observatory.sh"
      - ".github/workflows/site-ci.yml"
      - ".github/workflows/pages-www.yml"

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout validated benchmark evidence
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: benchmark-site
          path: .benchmark-site
          fetch-depth: 1
      - name: Checkout reviewed hara-docs release
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-docs
          ref: 563edc868ebd3bca018f6102f706a6600b5d0722
          path: website/docs
          fetch-depth: 1
      - name: Checkout hara-www
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-www
          path: website/hara-www
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/hara-www/package-lock.json
            benchmarks/package-lock.json
      - name: Install site dependencies
        run: |
          npm ci --prefix website/hara-www
          npm ci --prefix benchmarks
      - name: Prepare canonical evidence for Astro
        run: bash packaging/scripts/install-benchmark-site prepare
      - name: Validate benchmark publication
        run: |
          npm test --prefix benchmarks
          npm run build --prefix benchmarks
          test -s core/target/benchmarks/index.html
          grep -F '<title>Hara Benchmarks</title>' core/target/benchmarks/index.html
          grep -F 'id="class-comparison"' core/target/benchmarks/index.html
          grep -F 'id="language-shootout"' core/target/benchmarks/index.html
          grep -F 'rust-prepared' core/target/benchmarks/index.html
      - name: Validate main Hara site
        run: |
          npm test --prefix website/hara-www
          npm run build --prefix website/hara-www
