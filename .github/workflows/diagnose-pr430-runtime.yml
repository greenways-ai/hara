name: Diagnose PR 430 runtime

on:
  push:
    branches:
      - agent/fix-code-vm-observation-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - callable_var_scenarios_execute_from_shared_spec
          - foundation_code_test_compatibility_namespaces_are_embedded
          - module_ns_require_reload_executes_shared_spec_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run isolated failing test
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            "tests::${{ matrix.test }}" \
            -- --exact --nocapture --test-threads=1

  staged-namespace:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase:
          - namespace
          - register
          - direct
          - public
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Replace the broad probe with one staged expression
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("core/rust/src/lib.rs")
          text = path.read_text()
          start_marker = "    #[test]\n    fn namespace_use_refers_portable_test_vars_and_macros()"
          end_marker = "    #[test]\n    fn foundation_code_test_compatibility_namespaces_are_embedded()"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          sources = {
              "namespace": "(ns code.test-rust-probe (:use code.test)) :loaded",
              "register": "(ns code.test-rust-probe (:use code.test)) (fact \"simple\" (+ 1 1) => 2) :registered",
              "direct": "(ns code.test-rust-probe (:use code.test)) (fact \"simple\" (+ 1 1) => 2) (:status (run-selected nil {:namespace \"code.test-rust-probe\"}))",
              "public": "(ns code.test-rust-probe (:use code.test)) (fact \"simple\" (+ 1 1) => 2) (:status (run {:namespace \"code.test-rust-probe\"}))",
          }
          phase = os.environ["PHASE"]
          source = sources[phase]
          replacement = f'''    #[test]
              fn namespace_use_refers_portable_test_vars_and_macros() {{
                  let mut runtime = Runtime::new();
                  eprintln!("phase={phase}");
                  let result = runtime.eval_text(r#"{source}"#).unwrap();
                  eprintln!("result={{result}}");
              }}

          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Run staged namespace probe
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            tests::namespace_use_refers_portable_test_vars_and_macros \
            -- --exact --nocapture --test-threads=1
