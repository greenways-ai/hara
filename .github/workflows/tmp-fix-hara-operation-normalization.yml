name: Temporary Hara XTalk operation normalization

on:
  push:
    branches:
      - agent/tahto-hara-self-host

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tahto-hara-self-host
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize linked XTalk operation symbols
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '''(defn canonical-op
            [operation]
            (if (symbol? operation)
              (let [operation-name (name operation)]
                (if (string/starts-with? operation-name "x:")
                  (symbol operation-name)
                  operation))
              operation))'''

          new = '''(defn canonical-op
            [operation]
            (if (symbol? operation)
              (let [operation-source (str operation)
                    operation-index (string/index-of operation-source "x:" 0)]
                (if (<= 0 operation-index)
                  (symbol (string/slice operation-source operation-index))
                  operation))
              operation))'''

          paths = [
              Path('lib/src/tahto/model/v1/spec_hara/emit.hal'),
              Path('rust/hal-src/tahto/model/v1/spec_hara/emit.hal'),
          ]
          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: canonical-op block not found exactly once')
              path.write_text(text.replace(old, new))

          test_path = Path('lib/test/tahto/model/v1/spec_hara_test.hal')
          test = test_path.read_text().rstrip()
          fact = r'''

          ^{:refer tahto.model.v1.spec-hara.emit/canonical-op :added "4.1"}
          (fact "normalizes linked XTalk operation symbols before target mapping"
            [(hara-emit/canonical-op 'x:m-mod)
             (hara-emit/canonical-op 'xt.lang.spec-base/x:m-mod)
             (hara-emit/lower-top '(xt.lang.spec-base/x:m-mod 5 2) {})]
            => ['x:m-mod 'x:m-mod '(mod 5 2)])
          '''
          if 'normalizes linked XTalk operation symbols before target mapping' not in test:
              test += fact
          test_path.write_text(test + '\n')

          java_path = Path('java/src/test/java/hara/portable/HaraXtalkSelfHostedTest.java')
          java = java_path.read_text()
          java = java.replace('assertEquals(12, result.facts());', 'assertEquals(13, result.facts());', 1)
          java = java.replace('assertEquals(12, result.checks());', 'assertEquals(13, result.checks());', 1)
          java = java.replace('assertEquals(12, result.passedChecks());', 'assertEquals(13, result.passedChecks());', 1)
          java_path.write_text(java)

          manifest_path = Path('spec/tahto-hara-target.edn')
          manifest = manifest_path.read_text()
          manifest = manifest.replace(':facts 12\n   :checks 12', ':facts 13\n   :checks 13')
          manifest_path.write_text(manifest)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/tahto/model/v1/spec_hara/emit.hal \
            rust/hal-src/tahto/model/v1/spec_hara/emit.hal \
            lib/test/tahto/model/v1/spec_hara_test.hal \
            java/src/test/java/hara/portable/HaraXtalkSelfHostedTest.java \
            spec/tahto-hara-target.edn
          git commit -m "Normalize linked XTalk operations for the Hara target"
          git push origin HEAD:agent/tahto-hara-self-host
