name: Finish VM observation release gate

on:
  push:
    branches:
      - agent/finish-vm-observation-release-gate

permissions:
  contents: write

jobs:
  patch-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-vm-observation-release-gate
          fetch-depth: 0
      - name: Qualify IWorkRuntime adapter delegation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("core/lib/src/std/work/runtime/lifecycle.hal"),
              Path("core/rust/hal-src/std/work/runtime/lifecycle.hal"),
          ]
          old = '''(extend-type std.work.runtime.base/Runtime protocol/IWorkRuntime
            (-start [runtime work input options]
              (start-run runtime work input options))
            (-query [runtime reference options]
              (query-run runtime reference options))
            (-command [runtime reference command options]
              (command-run runtime reference command options)))'''
          new = '''(extend-type std.work.runtime.base/Runtime protocol/IWorkRuntime
            (-start [runtime work input options]
              (std.work.runtime.lifecycle/start-run runtime work input options))
            (-query [runtime reference options]
              (std.work.runtime.lifecycle/query-run runtime reference options))
            (-command [runtime reference command options]
              (std.work.runtime.lifecycle/command-run runtime reference command options)))'''

          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one IWorkRuntime adapter block in {path}")
              path.write_text(text.replace(old, new))

          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit("portable lifecycle source and Rust mirror diverged")

          for diagnostic in [
              Path(".github/workflows/diagnose-pr435-code-test.yml"),
              Path(".github/workflows/finish-vm-release-gate.yml"),
          ]:
              if diagnostic.exists():
                  diagnostic.unlink()
          PY
      - name: Commit release-gate fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix IWorkRuntime adapter delegation"
          git push origin HEAD:agent/finish-vm-observation-release-gate
