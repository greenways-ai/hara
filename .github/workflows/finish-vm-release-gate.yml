name: Finish VM observation release gate

on:
  push:
    branches:
      - agent/finish-vm-observation-release-gate

permissions:
  contents: write

jobs:
  patch-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-vm-observation-release-gate
          fetch-depth: 0
      - name: Qualify portable code.test recursion and remove diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("core/lib/src/code/test.hal"),
              Path("core/rust/hal-src/code/test.hal"),
          ]
          old = '''  ([] (run {}))
            ([selector-or-options]
             (run (work/local-runtime) selector-or-options {}))
            ([runtime selector-or-options]
             (run runtime selector-or-options {}))'''
          new = '''  ([] (code.test/run {}))
            ([selector-or-options]
             (code.test/run (work/local-runtime) selector-or-options {}))
            ([runtime selector-or-options]
             (code.test/run runtime selector-or-options {}))'''

          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one code.test/run recursion block in {path}")
              path.write_text(text.replace(old, new))

          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit("portable code.test source and Rust mirror diverged")

          for diagnostic in [
              Path(".github/workflows/diagnose-pr430-runtime.yml"),
              Path(".github/workflows/finish-vm-release-gate.yml"),
          ]:
              if diagnostic.exists():
                  diagnostic.unlink()
          PY
      - name: Commit release-gate fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix referred code.test run recursion"
          git push origin HEAD:agent/finish-vm-observation-release-gate
