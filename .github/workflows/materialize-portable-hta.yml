name: Materialize portable HTA codec

on:
  push:
    branches:
      - agent/extract-portable-hta-codec

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-portable-hta-codec
      - name: Install the reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Update the contributor release order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          source = path.read_text()
          old = ('`hara-abi`, `hara-wasm`, `hara-vm`, then `hara-compiler`. '
                 'The workflow waits')
          new = ('`hara-abi`, `hara-hta`, `hara-wasm`, `hara-vm`, then '
                 '`hara-compiler`. The workflow waits')
          if source.count(old) != 1:
              raise SystemExit('unexpected Rust crate publication order text')
          path.write_text(source.replace(old, new))
          PY
      - name: Format, lock, test and package the portable codec
        run: |
          cargo generate-lockfile --manifest-path core/rust/Cargo.toml
          cargo fmt --manifest-path core/rust/Cargo.toml --all
          cargo test --locked --manifest-path core/rust/Cargo.toml -p hara-hta
          cargo test --locked --manifest-path core/rust/Cargo.toml -p hara-wasm --test hta_portable
          cargo package --locked --allow-dirty --manifest-path core/rust/Cargo.toml -p hara-hta
      - name: Commit the reviewed codec graph
        run: |
          git config user.name "hara-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            AGENTS.md \
            core/rust/Cargo.lock \
            core/rust/hta-codec/src/lib.rs \
            core/rust/tests/hta_portable.rs
          git diff --cached --check
          git commit -m "Format and lock the portable HTA codec"
          git push origin HEAD:agent/extract-portable-hta-codec
