name: Tahto JS, Python, and Lua runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/lib/src/tahto/**'
      - 'core/lib/src/hara/runtime.hal'
      - 'core/rust/hal-src/tahto/**'
      - 'core/rust/hal-src/hara/runtime.hal'
      - 'core/lib/test/tahto/**'
      - 'core/lib/test/hara/runtime_test.hal'
      - 'core/lib/integration/hara/runtime_smoke.hal'
      - 'packaging/scripts/run-hara-runtime-smoke'
      - '.github/workflows/tahto-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tahto-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua -v
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Build Hara Truffle runtime
        run: mvn -B -Ptruffle -DskipTests package --file core/java/pom.xml
      - name: Execute emitted JavaScript, Python, and Lua
        run: bash packaging/scripts/run-hara-runtime-smoke
