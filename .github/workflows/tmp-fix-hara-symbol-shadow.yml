name: Temporary Hara symbol shadow repair

on:
  push:
    branches:
      - agent/tahto-hara-self-host

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tahto-hara-self-host
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove symbol constructor shadowing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '''(defn qualify-top-symbol
            [symbol context]
            (let [module (context-module context)]
              (if (or (namespace symbol) (nil? module))
                symbol
                (symbol (str module) (name symbol)))))'''

          new = '''(defn qualify-top-symbol
            [symbol-value context]
            (let [module (context-module context)]
              (if (or (namespace symbol-value) (nil? module))
                symbol-value
                (symbol (str module) (name symbol-value)))))'''

          paths = [
              Path('lib/src/tahto/model/v1/spec_hara/emit.hal'),
              Path('rust/hal-src/tahto/model/v1/spec_hara/emit.hal'),
          ]
          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected shadowing function exactly once')
              path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/tahto/model/v1/spec_hara/emit.hal rust/hal-src/tahto/model/v1/spec_hara/emit.hal
          git commit -m "Fix Hara target symbol qualification"
          git push origin HEAD:agent/tahto-hara-self-host
