name: Temporary Hara module boundary repair

on:
  push:
    branches:
      - agent/tahto-hara-self-host

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tahto-hara-self-host
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Emit explicit Hara namespace boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '''(defn rewrite-hara-source
            "Lowers canonical XTalk to one raw Hara source form before common emission."
            [form context]
            (list '-%%-
                  (pr-str (lower-top form context))))'''

          new = '''(defn rewrite-hara-source
            "Lowers canonical XTalk to raw Hara source with an explicit module boundary."
            [form context]
            (let [source (pr-str (lower-top form context))
                  module (context-module context)]
              (list '-%%-
                    (if module
                      (str (pr-str (list 'ns module))
                           "\\n"
                           source)
                      source))))'''

          paths = [
              Path('lib/src/tahto/model/v1/spec_hara/emit.hal'),
              Path('rust/hal-src/tahto/model/v1/spec_hara/emit.hal'),
          ]
          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected rewrite function exactly once')
              path.write_text(text.replace(old, new))

          manifest_path = Path('spec/tahto-hara-target.edn')
          manifest = manifest_path.read_text()
          marker = '  :module-state\n  "Top-level dependency definitions are qualified by their registered module and persist in the current Hara kernel."}'
          replacement = '  :module-state\n  "Every compiled entry or root expression emits an explicit Hara ns boundary; top-level definitions are also qualified by their registered module and persist in the current kernel."}'
          if marker not in manifest:
              raise SystemExit('manifest module-state marker not found')
          manifest_path.write_text(manifest.replace(marker, replacement))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/tahto/model/v1/spec_hara/emit.hal \
            rust/hal-src/tahto/model/v1/spec_hara/emit.hal \
            spec/tahto-hara-target.edn
          git commit -m "Emit Hara module namespace boundaries"
          git push origin HEAD:agent/tahto-hara-self-host
