name: Bootstrap lang namespace migration

# Invocation marker: run the atomic namespace migration from this main push.
# Pull-request invocation marker: recover the generated HARA-1 branch.
# Active-workflow push marker: generate the review branch now.
# Fixed-cleanup pull-request marker: generate the review branch now.
# Synchronize marker: execute the fixed generator from this bounded PR.
# Ready-state synchronize marker: schedule the fixed generator now.
# Workflow-token marker: restore workflows before the bot push.
# The pull_request event below is restricted to disposable trigger branches.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-lang-namespace-migration.yml'
      - 'packaging/scripts/migrate-tahto-to-lang'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-lang-namespace-migration.yml'
      - 'packaging/scripts/migrate-tahto-to-lang'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bootstrap-lang-namespace-migration
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.repository == 'hara-lang/hara' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        github.event.comment.body == '/run-lang-namespace-migration')) &&
      (github.event_name != 'pull_request' ||
       startsWith(github.head_ref, 'agent/lang-namespace-migration-pr-trigger'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip after the generated pull request exists
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view agent/lang-namespace-migration \
              --json state --jq '.state' 2>/dev/null | grep -qx OPEN; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Generated migration pull request is already open.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure migration branch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C agent/lang-namespace-migration

      - name: Perform and validate the hard namespace cut
        if: steps.guard.outputs.skip != 'true'
        run: python3 packaging/scripts/migrate-tahto-to-lang

      - name: Restore workflows for the token-safe generated push
        if: steps.guard.outputs.skip != 'true'
        run: |
          git restore --source=origin/main --staged --worktree -- .github/workflows
          git clean -fd -- .github/workflows
          git rm -f --ignore-unmatch -- packaging/scripts/migrate-tahto-to-lang

      - name: Commit and push generated migration
        if: steps.guard.outputs.skip != 'true'
        run: |
          git add -A
          git commit -m "Rename Tahto compiler namespaces to lang"
          git push --force origin HEAD:agent/lang-namespace-migration

      - name: Open the generated pull request
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/lang-pr-body.md <<'EOF'
          ## Summary

          This is the generated hard namespace cut following the merged
          `src-lang` / `test-lang` source-root migration.

          ```text
          tahto.* -> lang.*
          ```

          The production, test, and packaged Rust trees move from `tahto` to
          `lang`; executable references, dynamic registry symbols, generated
          source expectations, Java test names, and Hara-owned parity artifacts
          are rewritten atomically. Workflow-file rewrites are applied as a
          connector follow-up because GitHub's workflow token cannot modify
          `.github/workflows/*`.

          ## Compatibility boundary

          - no forwarding `tahto.*` namespaces
          - no changes to `xt.*` or `postgres.*` namespace names
          - no changes to serialized `:tahto/*` data vocabulary in this PR
          - historical upstream `src/tahto/...` references remain historical
            source paths

          ## Generated validation

          - canonical `src` / `src-lang` layout and duplicate-namespace guard
          - no-live-`tahto.*` code namespace guard
          - canonical-to-Rust HAL mirror regeneration and drift check
          - `git diff --check`

          The PR remains draft for the full JVM, Rust, HALC, WASM, portable
          language integration, and workflow-path suites.
          EOF

          gh pr create \
            --base main \
            --head agent/lang-namespace-migration \
            --draft \
            --title "Rename Tahto compiler namespaces to lang" \
            --body-file /tmp/lang-pr-body.md
