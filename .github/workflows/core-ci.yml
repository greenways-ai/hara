name: Core CI

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout hara-specs
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs
          path: hara-specs
          ref: 3012cbe74edd92b24783f1968a55dcf612c05364
          fetch-depth: 1

      - name: Detect core changes
        id: scope
        shell: bash
        run: |
          event="${{ github.event_name }}"
          case "$event" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              ;;
            *)
              echo "run_core=true" >> "$GITHUB_OUTPUT"
              echo "Running core validation for $event."
              exit 0
              ;;
          esac

          # A newly created branch has an all-zero `before` SHA. There is no
          # reliable comparison range in that case, so keep the conservative
          # behaviour and run the full core suite.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || \
             ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run_core=true" >> "$GITHUB_OUTPUT"
            echo "No valid base commit; running core validation."
            exit 0
          fi

          # Browser and Studio assets live under core/rust/web for packaging, but
          # they are not Cargo or JVM core inputs. Their dedicated Studio and
          # Site workflows build and validate them, so do not make pre-existing
          # native runtime failures block an otherwise isolated web change.
          if git diff --quiet "$base" "$head" -- \
            core/rust \
            ':(exclude)core/rust/web' \
            core/java \
            core/lib \
            contrib \
            hara-specs \
            packaging/scripts/run-lib-tests; then
            echo "run_core=false" >> "$GITHUB_OUTPUT"
            echo "No core runtime changes detected."
          else
            echo "run_core=true" >> "$GITHUB_OUTPUT"
            echo "Core runtime changes detected."
          fi

      - name: Enforce gw.* HAL namespaces
        if: steps.scope.outputs.run_core == 'true'
        shell: bash
        run: |
          if grep -R --exclude-dir=.git --include='*.hal' -n 'greenways\.' .; then
            echo "HAL namespaces must use gw.* rather than greenways.*" >&2
            exit 1
          fi

      - name: Set up Rust
        if: steps.scope.outputs.run_core == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Rust module layout
        if: steps.scope.outputs.run_core == 'true'
        run: |
          bash core/rust/scripts/check-layout.test.sh
          bash core/rust/scripts/check-layout.sh

      - name: Check Rust
        if: steps.scope.outputs.run_core == 'true'
        run: |
          cargo clippy --manifest-path core/rust/Cargo.toml --all-targets
          cargo test --manifest-path core/rust/Cargo.toml
          cargo test --manifest-path core/rust/raw/Cargo.toml

      - name: Set up JDK 21
        if: steps.scope.outputs.run_core == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Build and test Java runtime
        if: steps.scope.outputs.run_core == 'true'
        run: mvn -B -Ptruffle package --file core/java/pom.xml

      - name: Run library HAL tests
        if: steps.scope.outputs.run_core == 'true'
        run: ./packaging/scripts/run-lib-tests
