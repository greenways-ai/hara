name: Source analyzer diagnostic

on:
  push:
    branches:
      - agent/whole-wasm-code-analyzer
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Reproduce Core CI Rust validation
        id: check
        shell: bash
        run: |
          set +e
          {
            echo '=== cargo clippy --all-targets ==='
            cargo clippy --manifest-path core/rust/Cargo.toml --all-targets
            clippy_status=$?
            echo "clippy_status=$clippy_status"

            echo '=== cargo test core/rust ==='
            cargo test --manifest-path core/rust/Cargo.toml
            test_status=$?
            echo "test_status=$test_status"

            echo '=== cargo test core/rust/raw ==='
            cargo test --manifest-path core/rust/raw/Cargo.toml
            raw_status=$?
            echo "raw_status=$raw_status"

            if [ "$clippy_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$raw_status" -ne 0 ]; then
              exit 1
            fi
          } 2>&1 | tee source-analyzer-check.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish compiler output on PR 374
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          marker='<!-- hara-source-analyzer-diagnostic -->'
          {
            echo "$marker"
            echo "## Source analyzer Core CI diagnostic"
            echo
            echo "Exit status: **$STATUS**"
            echo
            echo '```text'
            tail -n 700 source-analyzer-check.log
            echo '```'
          } > source-analyzer-comment.md
          existing=$(gh api /repos/${GITHUB_REPOSITORY}/issues/374/comments \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH /repos/${GITHUB_REPOSITORY}/issues/comments/$existing \
              -f body="$(cat source-analyzer-comment.md)"
          else
            gh pr comment 374 --body-file source-analyzer-comment.md
          fi

      - name: Fail when Core CI validation failed
        if: steps.check.outputs.status != '0'
        run: exit 1
