name: Source analyzer diagnostic

on:
  push:
    branches:
      - agent/whole-wasm-code-analyzer
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check source analyzer binaries
        id: check
        shell: bash
        run: |
          set +e
          cargo check \
            --manifest-path core/rust/Cargo.toml \
            --features whole-wasm \
            --bin hara-rust-full \
            --bin hara-code-analyzer \
            2>&1 | tee source-analyzer-check.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish compiler output on PR 374
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
        shell: bash
        run: |
          marker='<!-- hara-source-analyzer-diagnostic -->'
          {
            echo "$marker"
            echo "## Source analyzer Cargo check"
            echo
            echo "Exit status: **$STATUS**"
            echo
            echo '```text'
            tail -n 500 source-analyzer-check.log
            echo '```'
          } > source-analyzer-comment.md
          existing=$(gh api /repos/${GITHUB_REPOSITORY}/issues/374/comments \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH /repos/${GITHUB_REPOSITORY}/issues/comments/$existing \
              -f body="$(cat source-analyzer-comment.md)"
          else
            gh pr comment 374 --body-file source-analyzer-comment.md
          fi

      - name: Fail when Cargo check failed
        if: steps.check.outputs.status != '0'
        run: exit 1
