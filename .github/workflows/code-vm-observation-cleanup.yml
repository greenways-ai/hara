name: Remove temporary bytecode observation validation files

on:
  push:
    branches: [agent/code-vm-observed-step]
    paths:
      - ".github/workflows/code-vm-observation-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-vm-observed-step
          fetch-depth: 0

      - name: Remove temporary validation files
        run: |
          git rm -f \
            .github/scripts/split-bytecode-observation.py \
            .github/workflows/code-vm-observation-layout.yml \
            .github/workflows/code-vm-observation-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary bytecode observation validation files"
          git push
