name: Generate lang metadata migration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'core/lib/src/lang/common/compat.hal'
      - 'core/lib/test/lang/common/compat_test.hal'
      - 'core/spec/fixtures/lang-metadata-v1/**'
      - 'packaging/scripts/check-no-tahto-language-metadata'
      - 'packaging/scripts/migrate-tahto-metadata-to-lang'
      - 'packaging/scripts/run-lang-metadata-migration'
      - 'packaging/scripts/finalize-lang-metadata-migration'
      - 'plans/lang-metadata-migration.md'
      - '.github/workflows/generate-lang-metadata-migration.yml'
      - '.github/workflows/language-source-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-lang-metadata-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.repository == 'hara-lang/hara' &&
      (github.event_name != 'pull_request' ||
       startsWith(github.head_ref, 'agent/lang-metadata-migration'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generator syntax
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile packaging/scripts/migrate-tahto-metadata-to-lang
          python3 -m py_compile packaging/scripts/run-lang-metadata-migration
          python3 -m py_compile packaging/scripts/finalize-lang-metadata-migration
          python3 -m py_compile packaging/scripts/check-no-tahto-language-metadata

      - name: Generate and validate HARA-2
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 packaging/scripts/run-lang-metadata-migration
          python3 packaging/scripts/finalize-lang-metadata-migration

      - name: Commit generated migration when required
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'HARA-2 branch is already generated.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize serialized language metadata migration"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
