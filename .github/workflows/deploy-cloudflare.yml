name: Deploy Cloudflare platform origins

on:
  push:
    branches: [main]
    paths:
      - platform/cloudflare/**
      - .github/workflows/deploy-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-platform-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    defaults:
      run:
        working-directory: platform/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate bindings and verify
        run: |
          npm run types
          npm run check
          npm test

      - name: Deploy worker (id./packages.hara-lang.org)
        run: npx wrangler deploy
