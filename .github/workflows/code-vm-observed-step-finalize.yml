name: Validate observed bytecode stepping

on:
  push:
    branches: [agent/code-vm-observed-step]
    paths:
      - ".github/workflows/code-vm-observed-step-finalize.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-vm-observed-step
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Place compile-time fixtures
        run: |
          rm -rf "$GITHUB_WORKSPACE/../hara-specs-registry"
          ln -s "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply validated fixture corrections
        run: python3 .github/scripts/fix-observed-step-tests.py

      - name: Format
        run: |
          cargo fmt --manifest-path core/rust/Cargo.toml --all
          cargo fmt --manifest-path core/rust/Cargo.toml --all -- --check

      - name: Run focused tests
        run: cargo test --manifest-path core/rust/Cargo.toml --features bytecode-observation vm::machine::observation::tests

      - name: Check observation-enabled library
        run: cargo clippy --manifest-path core/rust/Cargo.toml --features bytecode-observation --lib --no-deps

      - name: Commit validated test corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/rust/src/vm/machine/observation.rs
          git commit -m "Validate observed steps against optimized bytecode"
          git push
