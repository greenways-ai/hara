name: HAL source mirror

on:
  push:
    paths:
      - 'core/lib/src/**/*.hal'
      - 'core/rust/hal-src/**/*.hal'
      - 'packaging/scripts/sync-rust-hal-src'
      - '.github/workflows/hal-source-mirror.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/lib/src/**/*.hal'
      - 'core/rust/hal-src/**/*.hal'
      - 'packaging/scripts/sync-rust-hal-src'
      - '.github/workflows/hal-source-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hal-source-mirror-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core/rust/hal-src matches canonical core/lib/src
        run: python3 packaging/scripts/sync-rust-hal-src --check
