name: Fix Workspace main follow-up
on:
  push:
    branches: [agent/fix-spec-conformance-paths]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-spec-conformance-paths
      - name: Repair conformance paths and HAL mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("core/rust/src/cli_app.rs"): (
                  "../../../../hara-specs-registry/",
                  "../../../hara-specs-registry/",
              ),
              Path("core/rust/src/kernel/halc.rs"): (
                  "../../../../../hara-specs-registry/",
                  "../../../../hara-specs-registry/",
              ),
          }
          for path, (old, new) in replacements.items():
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f"expected path not found in {path}: {old}")
              path.write_text(source.replace(old, new))
          PY
          mkdir -p core/rust/hal-src/workspace
          cp core/lib/src/workspace.hal core/rust/hal-src/workspace.hal
          cp core/lib/src/workspace/core.hal core/rust/hal-src/workspace/core.hal
          cp core/lib/src/workspace/model.hal core/rust/hal-src/workspace/model.hal
          rm .github/workflows/fix-workspace-main.yml
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/rust/src/cli_app.rs core/rust/src/kernel/halc.rs core/rust/hal-src .github/workflows/fix-workspace-main.yml
          git commit -m "Fix Workspace mirrors and specs conformance paths"
          git push origin HEAD:agent/fix-spec-conformance-paths
