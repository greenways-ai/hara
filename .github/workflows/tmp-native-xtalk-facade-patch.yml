name: Temporary native XTalk collection patch

on:
  push:
    branches:
      - agent/hara-native-obj-arr-facade

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hara-native-obj-arr-facade
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Route Hara XTalk collections through the native facade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('lib/src/tahto/model/v1/spec_hara/emit.hal'),
              Path('rust/hal-src/tahto/model/v1/spec_hara/emit.hal'),
          ]

          exact = [
              (
                  '''(defn lower-vector
            [value context]
            (mapv #(lower % context) value))''',
                  '''(defn lower-vector
            [value context]
            (form
             (concat ['tahto.runtime.hara/arr-new]
                     (map #(lower % context) value))))'''
              ),
              (
                  '''(defn lower-map
            [value context]
            (reduce-kv
             (fn [out key item]
               (assoc out (lower key context)
                          (lower item context)))
             {}
             value))''',
                  '''(defn lower-map
            [value context]
            (form
             (reduce-kv
              (fn [out key item]
                (conj out
                      (lower key context)
                      (lower item context)))
              ['tahto.runtime.hara/obj-new]
              value)))'''
              ),
              (
                  '''        "x:get-key" (if (> (count arguments) 2)
                               (list 'let ['__tahto_value
                                           (list 'get
                                                 (lowered (argument 0))
                                                 (lowered (argument 1)))]
                                     (list 'if (list 'nil? '__tahto_value)
                                           (lowered (argument 2))
                                           '__tahto_value))
                               (list 'get
                                     (lowered (argument 0))
                                     (lowered (argument 1))))''',
                  '''        "x:get-key" (if (> (count arguments) 2)
                               (list 'tahto.runtime.hara/obj-get
                                     (lowered (argument 0))
                                     (lowered (argument 1))
                                     (lowered (argument 2)))
                               (list 'tahto.runtime.hara/obj-get
                                     (lowered (argument 0))
                                     (lowered (argument 1))))'''
              ),
              (
                  '''        "x:get-idx" (list 'nth
                                   (lowered (argument 0))
                                   (lowered (argument 1)))''',
                  '''        "x:get-idx" (list 'tahto.runtime.hara/arr-get
                                   (lowered (argument 0))
                                   (lowered (argument 1)))'''
              ),
              (
                  '''        "x:has-key?" (let [check (if (> (count arguments) 2)
                                            (argument 2)
                                            nil)
                                   found (list 'has?
                                               (lowered (argument 0))
                                               (lowered (argument 1)))]
                               (if (> (count arguments) 2)
                                 (list '= (lowered check) found)
                                 found))''',
                  '''        "x:has-key?" (let [found
                                         (list 'tahto.runtime.hara/obj-has?
                                               (lowered (argument 0))
                                               (lowered (argument 1)))]
                               (if (> (count arguments) 2)
                                 (list '= (lowered (argument 2)) found)
                                 found))'''
              ),
              (
                  '''        "x:obj-keys" (list 'vec (list 'keys (lowered (argument 0))))
                "x:obj-vals" (list 'vec (list 'vals (lowered (argument 0))))
                "x:obj-clone" (list 'into {} (lowered (argument 0)))''',
                  '''        "x:obj-keys" (list 'tahto.runtime.hara/obj-keys
                                   (lowered (argument 0)))
                "x:obj-vals" (list 'tahto.runtime.hara/obj-vals
                                   (lowered (argument 0)))
                "x:obj-clone" (list 'tahto.runtime.hara/obj-clone
                                    (lowered (argument 0)))'''
              ),
              (
                  '''        "x:arr-clone" (list 'vec (lowered (argument 0)))''',
                  '''        "x:arr-clone" (list 'tahto.runtime.hara/arr-clone
                                    (lowered (argument 0)))'''
              ),
              (
                  '''        "x:arr-map" (list 'map
                                  (lowered (argument 1))
                                  (lowered (argument 0)))
                "x:arr-filter" (list 'filter
                                     (lowered (argument 1))
                                     (lowered (argument 0)))
                "x:arr-foldl" (list 'reduce
                                    (lowered (argument 1))
                                    (if (> (count arguments) 2)
                                      (lowered (argument 2))
                                      nil)
                                    (lowered (argument 0)))''',
                  '''        "x:arr-map" (list 'tahto.runtime.hara/arr-map
                                  (lowered (argument 0))
                                  (lowered (argument 1)))
                "x:arr-filter" (list 'tahto.runtime.hara/arr-filter
                                     (lowered (argument 0))
                                     (lowered (argument 1)))
                "x:arr-foldl" (list 'tahto.runtime.hara/arr-fold-left
                                    (lowered (argument 0))
                                    (lowered (argument 1))
                                    (if (> (count arguments) 2)
                                      (lowered (argument 2))
                                      nil))'''
              ),
              (
                  '''        "x:is-object?" (list 'map? (lowered (argument 0)))
                "x:is-array?" (list 'vector? (lowered (argument 0)))''',
                  '''        "x:is-object?" (list 'tahto.runtime.hara/obj?
                                     (lowered (argument 0)))
                "x:is-array?" (list 'tahto.runtime.hara/arr?
                                    (lowered (argument 0)))'''
              ),
          ]

          for path in paths:
              text = path.read_text()
              for old, new in exact:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected replacement once: {old[:80]!r}, got {text.count(old)}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Commit emitter patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/tahto/model/v1/spec_hara/emit.hal \
            rust/hal-src/tahto/model/v1/spec_hara/emit.hal
          git commit -m "Emit native Obj and Arr values for Hara XTalk"
          git push origin HEAD:agent/hara-native-obj-arr-facade
