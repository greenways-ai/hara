name: Validate bytecode instrumentation benchmark modes

on:
  push:
    branches:
      - agent/code-vm-instrumentation

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'Validate bytecode instrumentation benchmark modes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-vm-instrumentation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format and compile all benchmark modes
        run: |
          rustfmt --edition 2021 core/rust/src/bin/hara-bytecode-benchmark.rs
          cargo check --manifest-path core/rust/Cargo.toml \
            --bin hara-bytecode-benchmark \
            --features bytecode-instrumentation,bytecode-observation
          cargo clippy --manifest-path core/rust/Cargo.toml \
            --bin hara-bytecode-benchmark \
            --features bytecode-instrumentation,bytecode-observation \
            --no-deps
      - name: Smoke comparative modes
        run: |
          source_hex="$(printf '(+ 1 (* 2 3))' | xxd -p -c 999)"
          for mode in \
            execute-feature-enabled \
            execute-instrumented-noop \
            execute-counted \
            execute-sampled \
            execute-events \
            execute-observed; do
            output="$(cargo run --quiet \
              --manifest-path core/rust/Cargo.toml \
              --bin hara-bytecode-benchmark \
              --features bytecode-instrumentation,bytecode-observation \
              -- "$mode" smoke "$source_hex" 7 1 2)"
            printf '%s\n' "$output"
            grep -Fq '"workload":"smoke"' <<<"$output"
            grep -Fq '"samples_ns":[' <<<"$output"
          done
      - name: Commit validated benchmark modes
        run: |
          git checkout origin/main -- core/rust/Cargo.lock
          rm .github/workflows/agent-code-vm-benchmarks.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust/src/bin/hara-bytecode-benchmark.rs core/rust/Cargo.lock \
            .github/workflows/agent-code-vm-benchmarks.yml
          git commit -m "Validate bytecode instrumentation benchmark modes"
          git push origin HEAD:agent/code-vm-instrumentation
