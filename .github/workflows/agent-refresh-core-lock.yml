name: Refresh the Core Rust lock

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/refresh-core-lock-after-response-source'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the current stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Reconcile the existing lock with the reviewed workspace
        run: cargo build --release --manifest-path core/rust/Cargo.toml --bin hara

      - name: Prove the repair is lock-complete and narrowly scoped
        run: |
          git diff --check
          test "$(git diff --name-only)" = "core/rust/Cargo.lock"
          cargo build --locked --release --manifest-path core/rust/Cargo.toml --bin hara

      - name: Commit the validated lock repair
        run: |
          if git diff --quiet -- core/rust/Cargo.lock; then
            echo 'The Core Rust lock is already current.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust/Cargo.lock
          git commit -m 'Refresh the Core Rust lock'
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git rebase origin/${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
