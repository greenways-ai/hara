name: Studio runtime archive CI

on:
  pull_request:
    branches: [main, prod]
    paths:
      - .github/studio-runtime-release.json
      - .github/workflows/publish-rust-crates.yml
      - .github/workflows/publish-studio-runtime.yml
      - .github/workflows/studio-runtime-ci.yml
      - packaging/scripts/build-bytecode-observation-wasm
      - packaging/scripts/build-studio-runtime
      - packaging/scripts/build-studio-runtime-base
      - packaging/scripts/build-hara-wasm-raw
      - packaging/scripts/build-www
      - packaging/scripts/check-release-version.mjs
      - packaging/scripts/verify-bytecode-observation-runtime.mjs
      - packaging/scripts/verify-studio-runtime.mjs
      - packaging/scripts/write-kernel-manifest.mjs
      - core/rust/Cargo.toml
      - core/rust/Cargo.lock
      - core/rust/compiler/Cargo.toml
      - core/rust/observation-raw/**
      - core/rust/raw/**
      - core/rust/src/**
      - core/rust/vm-runtime/Cargo.toml
      - core/rust/web/package.json
      - core/rust/web/bytecode-observation.test.mjs
      - core/rust/web/hta.js
      - core/rust/web/hta-worker.js
      - core/rust/web/hta-shared-worker.js
      - core/rust/web/packages/hta/**
      - core/rust/web/host/**
      - core/rust/web/studio/**
      - core/rust/web/ui/**
      - contrib/greenways/supersonic/**
      - core/lib/src/std/foundation.hal
      - core/lib/src/std/lib/substrate.hal
      - core/lib/src/std/lib/substrate/**
  push:
    branches: [main, prod]
    paths:
      - .github/studio-runtime-release.json
      - .github/workflows/publish-rust-crates.yml
      - .github/workflows/publish-studio-runtime.yml
      - .github/workflows/studio-runtime-ci.yml
      - packaging/scripts/build-bytecode-observation-wasm
      - packaging/scripts/build-studio-runtime
      - packaging/scripts/build-studio-runtime-base
      - packaging/scripts/build-hara-wasm-raw
      - packaging/scripts/build-www
      - packaging/scripts/check-release-version.mjs
      - packaging/scripts/verify-bytecode-observation-runtime.mjs
      - packaging/scripts/verify-studio-runtime.mjs
      - packaging/scripts/write-kernel-manifest.mjs
      - core/rust/Cargo.toml
      - core/rust/Cargo.lock
      - core/rust/compiler/Cargo.toml
      - core/rust/observation-raw/**
      - core/rust/raw/**
      - core/rust/src/**
      - core/rust/vm-runtime/Cargo.toml
      - core/rust/web/package.json
      - core/rust/web/bytecode-observation.test.mjs
      - core/rust/web/hta.js
      - core/rust/web/hta-worker.js
      - core/rust/web/hta-shared-worker.js
      - core/rust/web/packages/hta/**
      - core/rust/web/host/**
      - core/rust/web/studio/**
      - core/rust/web/ui/**
      - contrib/greenways/supersonic/**
      - core/lib/src/std/foundation.hal
      - core/lib/src/std/lib/substrate.hal
      - core/lib/src/std/lib/substrate/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned hara-www payload
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-www
          ref: 3acd4ecfd024ef48320239751e89c80b81fd25d0
          path: website/hara-www
          fetch-depth: 1
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check packaging script syntax
        run: |
          bash -n \
            packaging/scripts/build-bytecode-observation-wasm \
            packaging/scripts/build-studio-runtime \
            packaging/scripts/build-studio-runtime-base \
            packaging/scripts/build-www
          node --check packaging/scripts/check-release-version.mjs
          node --check packaging/scripts/verify-bytecode-observation-runtime.mjs
          node --check packaging/scripts/write-kernel-manifest.mjs

      - name: Test live bytecode observation boundary
        run: |
          cargo test --manifest-path core/rust/observation-raw/Cargo.toml
          node --test core/rust/web/bytecode-observation.test.mjs

      - name: Verify release version surfaces
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' core/rust/Cargo.toml | head -n 1)
          node packaging/scripts/check-release-version.mjs "$VERSION"

      - name: Build and verify Studio runtime archive
        run: packaging/scripts/build-studio-runtime ci

      - name: Verify archive checksum and browser payload
        shell: bash
        run: |
          ARCHIVE="$GITHUB_WORKSPACE/core/target/studio-runtime/hara-studio-runtime-ci.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          RAW_LISTING="$RUNNER_TEMP/hara-studio-runtime-files.raw"
          LISTING="$RUNNER_TEMP/hara-studio-runtime-files.txt"
          test -s "$ARCHIVE"
          test -s "$CHECKSUM"
          sha256sum -c "$CHECKSUM"
          tar -tzf "$ARCHIVE" > "$RAW_LISTING"
          sed 's#^\./##' "$RAW_LISTING" > "$LISTING"
          grep -Fxq 'rust/bytecode-observation.wasm' "$LISTING"
          grep -Fxq 'rust/host/bytecode-observation.js' "$LISTING"
          grep -Fxq 'rust/packages/hta/index.js' "$LISTING"
          grep -Fxq 'rust/packages/hta/worker.js' "$LISTING"
          grep -Fxq 'rust/packages/hta/shared-worker.js' "$LISTING"
          grep -Fxq 'rust/studio/supersonic.js' "$LISTING"
          grep -Fxq 'rust/studio/hal/supersonic.hal' "$LISTING"
          grep -Fxq 'examples/music/runtime/bytecode-observation.wasm' "$LISTING"
          grep -Fxq 'examples/music/runtime/host/bytecode-observation.js' "$LISTING"
          grep -Fxq 'examples/music/runtime/packages/hta/index.js' "$LISTING"
          grep -Fxq 'examples/music/runtime/packages/hta/worker.js' "$LISTING"
          grep -Fxq 'examples/music/runtime/packages/hta/shared-worker.js' "$LISTING"
          grep -Fxq 'examples/music/runtime/studio/supersonic.js' "$LISTING"
          grep -Fxq 'examples/music/runtime/studio/hal/supersonic.hal' "$LISTING"

      - uses: actions/upload-artifact@v4
        with:
          name: hara-studio-runtime-${{ github.sha }}
          path: |
            core/target/studio-runtime/hara-studio-runtime-ci.tar.gz
            core/target/studio-runtime/hara-studio-runtime-ci.tar.gz.sha256
          retention-days: 7
